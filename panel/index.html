<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KASUGAI Agent — チャット</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
         color: #1f2937; background: #f3f5f8; height: 100vh; display: flex; }
  /* ---- ペイン境界グリップ（ドラッグで幅可変） ---- */
  .grip { width: 5px; flex: none; cursor: col-resize; }
  .grip:hover, .grip.on { background: #bfdbfe; }
  body.dragging { user-select: none; cursor: col-resize; }
  /* ---- 右ペイン（doc browser / フォルダツリー。chats 時は管理セクション） ---- */
  #side { width: 320px; flex: none; background: #fff; border-left: 1px solid #e5e7eb;
          display: flex; flex-direction: column; }
  .brand { padding: 14px 14px 10px; font-weight: 700; font-size: 15px; }
  .brand small { display: block; font-weight: 400; color: #9ca3af; font-size: 12px; }
  #devbadge { display: none; margin-left: 6px; padding: 1px 6px; border-radius: 4px;
              background: #dc2626; color: #fff; font-size: 10px; font-weight: 700;
              vertical-align: 2px; letter-spacing: .05em; }
  .csess { display: flex; align-items: center; gap: 6px; padding: 8px 10px; margin: 2px 0;
           border-radius: 7px; cursor: pointer; font-size: 13px; color: #374151;
           border: 1px solid transparent; }
  .csess:hover { background: #f3f4f6; }
  .csess.active { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
  .csess .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .csess .dot { color: #2563eb; }
  .csess.off { opacity: .45; cursor: default; }
  .csess.off:hover { background: none; }
  /* ---- 省略ラベルの全文ポップアップ（data-tip をホバーで即時表示） ---- */
  #tip { display: none; position: fixed; z-index: 70; max-width: 420px;
         max-height: 80vh; overflow: hidden;
         padding: 6px 9px; border-radius: 6px; background: #111827;
         color: #f9fafb; font-size: 12px; white-space: pre-wrap;
         word-break: break-word; box-shadow: 0 8px 24px rgba(0,0,0,.28);
         pointer-events: none; }
  /* ---- 左ペイン（title + カレントrepo選択 + 縦並びナビ） ---- */
  #mgmt { width: 240px; flex: none; background: #fff; border-right: 1px solid #e5e7eb;
          display: flex; flex-direction: column; }
  .mhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px;
           border-bottom: 1px solid #e5e7eb; font-weight: 700; }
  #repo-row { display: flex; flex-direction: column; gap: 4px; margin: 0 12px 8px; }
  #repo-owner, #repo-name { width: 100%; font-size: 15px; padding: 5px 6px;
                border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
  #repo-owner { color: #6b7280; }
  #mgmt .mnav { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px;
                border-bottom: 1px solid #e5e7eb; }
  #mgmt .mnav button { text-align: left; }
  #mgmt .mnav .nsep { border: 0; border-top: 1px solid #e5e7eb; margin: 2px 0; }
  #mgmt .mnav button.active { background: #eff6ff; border-color: #bfdbfe;
                              color: #1d4ed8; }
  #mgmtbox { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .sec { margin-bottom: 14px; break-inside: avoid; }
  .sec h3 { margin: 0 0 6px; font-size: 12px; color: #6b7280; letter-spacing: .04em;
            text-transform: uppercase; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; margin: 3px 0; }
  .kv span { color: #6b7280; }
  .item { padding: 7px 2px; border-top: 1px dashed #eef2f7; cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:hover { background: #f8fafc; }
  .item.sel { background: #eff6ff; }
  .muted { color: #9ca3af; font-size: 12px; margin-top: 2px; }
  .empty { color: #9ca3af; font-size: 12px; padding: 6px 0; }
  .vetok { color: #059669; font-weight: 600; font-size: 11px; margin-left: 6px; }
  .vetng { color: #dc2626; font-weight: 600; font-size: 11px; margin-left: 6px; cursor: help; }
  .vetst { color: #6b7280; font-size: 11px; margin-left: 6px; }
  .pbtns { margin-top: 4px; display: flex; gap: 6px; }
  .pbtns button { font-size: 11px; padding: 2px 10px; }
  .pill { display: inline-block; min-width: 42px; margin-right: 6px; padding: 1px 6px;
          border-radius: 999px; background: #f3f4f6; color: #6b7280; font-size: 12px;
          text-align: center; }
  .pill.live { background: #dcfce7; color: #166534; }
  .pill.run { background: #fef3c7; color: #92400e; }
  .pill.wait { background: #ede9fe; color: #5b21b6; }
  .pill.resume { background: #e0e7ff; color: #3730a3; }
  .pill.par { background: #fdf4ff; color: #a21caf; }
  .pill.ver { background: #cffafe; color: #155e75; }
  .pill.unres { background: #fee2e2; color: #991b1b; }
  .pill.repo { background: #f1f5f9; color: #475569; }
  .pill.ctx { background: #e0f2fe; color: #075985; min-width: 0; }
  .pill.prio { background: #fee2e2; color: #b91c1c; min-width: 0; }
  .pill.def { background: #f1f5f9; color: #475569; min-width: 0; }
  /* ヘッダの親子リンク（子→親 / 親→子） */
  #plink a { color: #a21caf; font-size: 12px; margin-right: 8px; cursor: pointer; }
  /* ---- 処理状況カンバン（中央ペイン: 状態別の横並び列） ---- */
  #board { display: flex; gap: 10px; align-items: flex-start; }
  .bcol { flex: 1 1 0; min-width: 170px; background: #f8fafc;
          border: 1px solid #e5e7eb; border-radius: 8px; }
  /* 列幅は内容量で可変: 空列は半分幅、2件以上は flex-grow を件数比例で
     上げ（上限4）・カードを幅に応じた多段グリッドで敷き詰める */
  .bcol.empty { flex: 0.5 1 0; min-width: 90px; }
  .bcol.many .bcards { display: grid; gap: 6px;
                       grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .bcol.many .bcard { margin-bottom: 0; }
  .bcol .bhead { display: flex; align-items: center; justify-content: space-between;
                 padding: 7px 9px; border-bottom: 1px solid #e5e7eb; gap: 6px; }
  .bcol .bhead .n { color: #9ca3af; font-size: 12px; margin-left: auto; }
  .bcol .bhead .bxall { font-size: 11px; padding: 1px 6px; color: #9ca3af; }
  .bcol .bhead .bxall:hover { color: #dc2626; border-color: #fca5a5; }
  .bcol .bcards { padding: 6px; }
  .bcard { position: relative; background: #fff; border: 1px solid #e5e7eb;
           border-radius: 7px; padding: 7px 9px; margin-bottom: 6px;
           cursor: pointer; font-size: 12px; }
  .bcard:last-child { margin-bottom: 0; }
  .bcard:hover { border-color: #93c5fd; }
  .bcard .bx { position: absolute; bottom: 4px; right: 6px; color: #9ca3af;
               padding: 0 4px; border-radius: 4px; visibility: hidden; }
  .bcard:hover .bx { visibility: visible; }
  .bcard .bx:hover { color: #dc2626; background: #fee2e2; }
  .bcard .bx.t { top: 4px; bottom: auto; }   /* 右下にアクションボタンがあるカードは右上へ */
  .bcard .bact { position: absolute; bottom: 4px; right: 6px; font-size: 12px;
                 padding: 1px 8px; }
  /* ボード上部の一括操作バー（処理再開ボタン） */
  #boardwrap .btools { display: flex; align-items: center; gap: 8px;
                       margin-bottom: 8px; }
  #boardwrap .btools .muted { margin-top: 0; }
  /* ---- 設定ビュー（中央ペインの repo カード） ---- */
  .rcard { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
           padding: 10px 12px; margin-bottom: 10px; font-size: 12px; max-width: 720px; }
  /* リポジトリカードの横並びグリッド（登録フォームは従来どおり全幅） */
  .rgrid { display: grid; gap: 10px;
           grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .rgrid .rcard { margin-bottom: 0; max-width: none; }
  .rset { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
          margin-top: 8px; }
  .rset label { display: flex; align-items: center; gap: 4px; }
  .rset input[type="text"] { font-size: 12px; padding: 3px 6px;
           border: 1px solid #d1d5db; border-radius: 6px; width: 8em; }
  .rset input.wide { width: 22em; }
  /* ---- 設定ビューのグループタブ（接続AI / リポジトリ / システム） ---- */
  .stabs { display: flex; gap: 4px; margin-bottom: 12px;
           border-bottom: 1px solid #e5e7eb; max-width: 720px; }
  .stabs .stab { border: 1px solid transparent; border-bottom: 0;
                 border-radius: 6px 6px 0 0; margin-bottom: -1px;
                 color: #6b7280; }
  .stabs .stab.active { background: #eff6ff; border-color: #bfdbfe;
                        color: #1d4ed8; }
  /* リポジトリタブ内のサブタブ（GitHub owner / ユーザー / (owner なし) の
     グループ切替）。ピル型・下線なし */
  .stabs.sub { border-bottom: 0; margin-bottom: 10px; gap: 6px;
               max-width: none; }
  .stabs.sub .stab { border: 1px solid #e5e7eb; border-radius: 999px;
                     margin-bottom: 0; padding: 2px 10px; font-size: 11px; }
  .stabs.sub .stab.active { background: #eff6ff; border-color: #bfdbfe;
                            color: #1d4ed8; }
  /* ---- フォルダツリー（エディターナビ → 右ペイン） ---- */
  #treebox { flex: 1; overflow-y: auto; padding: 6px 4px; font-size: 12px; }
  .trow { display: flex; align-items: center; gap: 2px; padding: 2px 4px;
          border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .trow:hover { background: #f3f4f6; }
  .trow.sel { background: #eff6ff; color: #1d4ed8; }
  .trow.off { opacity: .45; cursor: default; }
  .trow.off:hover { background: none; }
  .trow .tg { width: 14px; flex: none; text-align: center; color: #6b7280; }
  .trow .tn { overflow: hidden; text-overflow: ellipsis; }
  /* ---- 再起動バナー（延期中/再起動中は最上部に固定表示） ---- */
  #rban { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 60;
          background: #fef3c7; color: #92400e; text-align: center; font-size: 12px;
          padding: 6px; border-bottom: 1px solid #fde68a; }
  /* ---- ローカルパス選択（/api/fs/dirs の簡易ピッカー） ---- */
  #dirmodal { display: none; position: fixed; inset: 0; z-index: 50;
              background: rgba(15,23,42,.35); align-items: center;
              justify-content: center; }
  #dirpanel { background: #fff; border-radius: 10px; width: 440px;
              max-width: 90vw; max-height: 70vh; padding: 10px 12px;
              display: flex; flex-direction: column;
              box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  #dirpanel .dhead { display: flex; align-items: center; }
  .dcur { font-family: Consolas, monospace; font-size: 12px; color: #6b7280;
          margin: 6px 0; word-break: break-all; }
  #dirlist { flex: 1; overflow-y: auto; border: 1px solid #e5e7eb;
             border-radius: 6px; min-height: 160px; }
  .ditem { padding: 6px 10px; font-size: 12px; cursor: pointer;
           border-bottom: 1px dashed #eef2f7; }
  .ditem:last-child { border-bottom: 0; }
  .ditem:hover { background: #eff6ff; }
  #dirpanel .dfoot { display: flex; gap: 8px; justify-content: flex-end;
                     margin-top: 8px; }
  /* ---- doc browser（右ペインの AGENTS/SKILL 詳細） ---- */
  #dochead { display: none; align-items: center; gap: 6px; padding: 10px 12px;
             border-bottom: 1px solid #e5e7eb; font-weight: 700; font-size: 13px; }
  #doclist { flex: 1; overflow-y: auto; padding: 4px 8px; }
  #reflist { flex: none; max-height: 45%; overflow-y: auto; padding: 4px 8px;
             border-top: 1px solid #e5e7eb; }
  .refhead { padding: 6px 4px 2px; font-size: 12px; color: #6b7280;
             letter-spacing: .04em; text-transform: uppercase; }
  /* ---- doc view（中央ペインの doc 本文表示。chat 用 UI を隠す） ---- */
  #main.doc .chatonly { display: none; }
  #head .doconly { display: none; }
  #main.doc #head .doconly { display: inline-block; }
  #main.doc #box .msg { max-width: 100%; margin-left: 0; margin-right: 0; }
  /* doc viewer の原文/プレビュー切替ボタン */
  #viewsw button.active { background: #eff6ff; border-color: #bfdbfe;
                          color: #1d4ed8; }
  /* HTML プレビューは sandboxed iframe を box いっぱいに敷く */
  #box.htmlview { padding: 0; display: flex; flex-direction: column; }
  .htmlprev { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
  /* ---- 中央ペインの chat/console タブ（chat モード時のみ表示） ---- */
  #ctabs { display: flex; gap: 4px; padding: 8px 16px 0; background: #fff; }
  #ctabs .ctab { border: 1px solid transparent; border-bottom: 0;
                 border-radius: 6px 6px 0 0; color: #6b7280; }
  #ctabs .ctab.active { background: #eff6ff; border-color: #bfdbfe;
                        color: #1d4ed8; }
  #condot { color: #f59e0b; }
  /* console タブ選択中は chat の #box/#input を隠して #conbox を出す
     （doc/処理状況/設定モード＝.doc が付く間は常に doc 側を優先） */
  #main.contab:not(.doc) #box, #main.contab:not(.doc) #input { display: none; }
  #main.contab:not(.doc) #conbox { display: block; }
  #conbox { display: none; flex: 1; overflow-y: auto; margin: 0;
            padding: 10px 14px; background: #0f172a; color: #d1d5db;
            font-family: Consolas, monospace; font-size: 12px; }
  .cl { white-space: pre-wrap; word-break: break-all; line-height: 1.45; }
  .cl .t, .cl .cs { color: #475569; margin-right: 8px; }
  .cl.err { color: #fca5a5; }
  .cl.err .t, .cl.err .cs { color: #b91c1c; }
  .cl.sys { color: #7dd3fc; }
  .cl.sys .t, .cl.sys .cs { color: #0e7490; }
  /* ---- メイン ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
          background: #fff; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  #head .title { font-weight: 600; flex: 1 1 100%; }
  /* 削除ボタン表示時はタイトルを1行目に同居させる（通常は全幅で2行目以降を押し出す） */
  #head .title.withdel { flex: 1 1 auto; }
  #status { color: #6b7280; font-size: 12px; }
  #head select { font-size: 12px; padding: 3px 6px; border: 1px solid #d1d5db;
                 border-radius: 6px; background: #fff; max-width: 220px; }
  .spacer { flex: 1; }
  button { font-size: 12px; padding: 5px 10px; border: 1px solid #d1d5db; border-radius: 6px;
           background: #fff; cursor: pointer; color: #374151; }
  button:hover { background: #f3f4f6; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.primary.busy { background: #f59e0b; border-color: #f59e0b; }
  /* ---- メッセージ ---- */
  #box { flex: 1; overflow-y: auto; padding: 16px 20px; background: #fff; }
  .msg { max-width: 82%; margin: 6px 0; padding: 9px 13px; border-radius: 12px;
         white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
  .msg.user { margin-left: auto; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .msg.thought { background: #fafaf9; border: 1px dashed #e7e5e4; color: #78716c;
                 font-size: 12.5px; }
  .msg.thought::before { content: "💭 "; }
  .msg.tool { background: none; border: none; padding: 2px 13px; color: #6b7280;
              font-size: 12px; font-family: Consolas, monospace; }
  .msg.tool::before { content: "🔧 "; }
  .msg.plan { background: #fffbeb; border: 1px solid #fde68a; font-size: 12.5px; }
  .msg.sys { max-width: 100%; margin: 4px auto; background: none; border: none;
             color: #9ca3af; font-size: 12px; text-align: center; padding: 2px; }
  .msg .time { display: block; font-size: 12px; color: #9ca3af; margin-top: 4px; }
  .msg.user .time { color: #bfdbfe; }
  .msg .edit { cursor: pointer; margin-left: 8px; font-size: 12px; color: #111;
               background: rgba(255,255,255,.92); border-radius: 4px; padding: 1px 6px; }
  .msg .edit:hover { background: #fff; text-decoration: underline; }
  /* Markdown（agent/thought/plan のみ。raw HTML は esc 済み） */
  .msg.md { white-space: normal; }
  .msg.md p { margin: .35em 0; }
  .msg.md h1, .msg.md h2, .msg.md h3, .msg.md h4, .msg.md h5, .msg.md h6 {
    margin: .65em 0 .3em; line-height: 1.3; font-weight: 700; }
  .msg.md h1 { font-size: 1.15em; } .msg.md h2 { font-size: 1.08em; }
  .msg.md h3, .msg.md h4, .msg.md h5, .msg.md h6 { font-size: 1em; }
  .msg.md code { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 4px;
                 padding: 0 .25em; font-family: Consolas, monospace; font-size: max(.92em, 12px); }
  .msg.md pre { background: #111827; color: #e5e7eb; padding: 10px 12px;
                border-radius: 8px; overflow-x: auto; margin: .5em 0; }
  .msg.md pre code { background: none; border: 0; padding: 0; color: inherit; }
  .msg.md pre.mermaid[data-processed] { background: #fff; color: #1f2937;
                                        border: 1px solid #e5e7eb; }
  .msg.md pre.mermaid svg { max-width: 100%; height: auto; }
  /* mermaid 図は pre 内で中央配置（幅超過時は左起点スクロール）。
     拡縮: ドラッグで視野移動（横は pre・縦は #box がスクロール） */
  .msg.md pre.mermaid[data-processed] svg { display: block; margin: 0 auto; cursor: grab; }
  .msg.md pre.mermaid.pan svg { cursor: grabbing; }
  #vw-zoom { display: inline-flex; gap: 0; }
  #vw-zoom button { border-radius: 0; margin-left: -1px; }
  #vw-zoom button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  #vw-zoom button:last-child { border-radius: 0 6px 6px 0; }
  #vw-zv { min-width: 4.2em; }
  .msg.md ul, .msg.md ol { margin: .35em 0 .35em 1.4em; padding: 0; }
  .msg.md blockquote { margin: .5em 0; padding: .2em .8em; color: #4b5563;
                       background: #f8fafc; border-left: 3px solid #cbd5e1; }
  .msg.md table { border-collapse: collapse; margin: .5em 0; font-size: max(.95em, 12px); }
  .msg.md th, .msg.md td { border: 1px solid #e5e7eb; padding: 4px 8px; }
  .msg.md th { background: #f9fafb; }
  .msg.md a { color: #2563eb; }
  .msg.md hr { border: 0; border-top: 1px solid #e5e7eb; margin: .8em 0; }
  /* 非 md doc（json/html/mjs 等）の生テキスト表示 */
  .rawfile { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
             padding: 12px 14px; font-family: Consolas, monospace; font-size: 12px;
             white-space: pre; overflow-x: auto; margin: 6px 0; line-height: 1.5; }
  .typing { display: inline-block; }
  .typing span { animation: blink 1.2s infinite; display: inline-block; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .2; } 30% { opacity: 1; } }
  /* ---- リポジトリ確認バー（waiting kind=repo の切替/このまま送信） ---- */
  #repoask { display: none; align-items: center; gap: 8px; padding: 8px 16px;
             background: #fffbeb; border-top: 1px solid #fde68a; font-size: 12px;
             color: #92400e; }
  #repoask .grow { flex: 1; }
  /* ---- 入力 ---- */
  #input { padding: 10px 16px 14px; background: #fff; border-top: 1px solid #e5e7eb; }
  #imgs { margin-bottom: 6px; }
  #imgs .thumb { position: relative; display: inline-block; margin-right: 8px; }
  #imgs img { height: 48px; border: 1px solid #cbd5e1; border-radius: 4px; }
  #imgs .fchip { display: inline-block; height: 48px; line-height: 48px; padding: 0 10px;
                 font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; }
  #imgs .del { position: absolute; top: -6px; right: -6px; background: #dc2626; color: #fff;
               border-radius: 50%; width: 16px; height: 16px; font-size: 12px;
               line-height: 16px; text-align: center; cursor: pointer; }
  #row { display: flex; gap: 8px; align-items: flex-end; }
  #exmode { align-self: center; font-size: 12px; padding: 6px 4px;
            border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
  #text { flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 8px;

<script>
const API = '';
let sel = null;            // 選択中チャット id（null = 新規）
let repos = [];
let files = [];
let busySince = 0;
let sendVerify = false;    // busy 中の送信ボタンを検証中表示にする（setSendBusy 経由）
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const J = (m, p, body) => fetch(API + p, {
  method: m, headers: { 'content-type': 'application/json' },
  body: body ? JSON.stringify(body) : undefined }).then((r) => r.json());

// ---------- 内容表示（Viewer に集約） ----------
// chat message・doc 本文・参照ファイルの描画はすべてこのオブジェクト経由。
// kind 判定（md/html/mmd/その他）・原文/プレビュー切替・Markdown 変換・
// mermaid 後処理を一箇所にまとめる
const Viewer = {
  view: 'preview',                       // doc 本文の 'preview' | 'raw'
  setView(v) { this.view = v === 'raw' ? 'raw' : 'preview'; },
  kind(j) {                              // /api/doc 応答 → 表示種別
    const p = String(j?.path || j?.name || '');
    if (/\.(md|markdown)$/i.test(p)) return 'md';
    if (/\.html?$/i.test(p)) return 'html';
    if (/\.mmd$/i.test(p)) return 'mmd';
    return '';
  },
  // ---- Markdown → HTML（agent/thought/plan と .md 本文で共用。
  //      先に全文 HTML escape してから inline 変換する） ----
  inline(s) {
    let x = esc(s);
    const hold = [];
    x = x.replace(/`([^`]+)`/g, (_, c) => {
      hold.push(`<code>${c}</code>`);
      return `\u0000${hold.length - 1}\u0000`;
    });
    x = x.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    x = x.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    x = x.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    x = x.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    x = x.replace(/(^|\W)_([^_]+)_(?=\W|$)/g, '$1<em>$2</em>');
    return x.replace(/\u0000(\d+)\u0000/g, (_, n) => hold[+n]);
  },
  cells(l) { return l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim()); },
  md(src) {
    const lines = String(src ?? '').replace(/\r\n?/g, '\n').split('\n');
    const blank = (l) => /^\s*$/.test(l);
    const tableSep = (l) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
    const blockStart = (l, i) => /^\s*```/.test(l) || /^\s*#{1,6}\s+/.test(l) ||
      /^\s*>\s?/.test(l) || /^\s*[-*+]\s+/.test(l) || /^\s*\d+\.\s+/.test(l) ||
      /^\s*(---+|\*\*\*+|___+)\s*$/.test(l) ||
      (l.includes('|') && i + 1 < lines.length && tableSep(lines[i + 1]));
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (blank(l)) { i++; continue; }
      if (/^\s*```/.test(l)) {
        const lang = l.trim().slice(3).trim();
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++;
        const code = esc(buf.join('\n'));
        out.push(lang === 'mermaid'
          ? `<pre class="mermaid">${code}</pre>`
          : `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ''}>${code}</code></pre>`);
        continue;
      }
      const hm = l.match(/^\s*(#{1,6})\s+(.*)$/);
      if (hm) {
        out.push(`<h${hm[1].length}>${this.inline(hm[2])}</h${hm[1].length}>`);
        i++; continue;
      }
      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^\s*>\s?/.test(l)) {
        const buf = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i]))
          buf.push(lines[i++].replace(/^\s*>\s?/, ''));
        out.push(`<blockquote>${buf.map((b) => this.inline(b)).join('<br>')}</blockquote>`);
        continue;
      }
      if (l.includes('|') && i + 1 < lines.length && tableSep(lines[i + 1])) {
        const header = this.cells(l);
        i += 2;
        const rows = [];
        while (i < lines.length && !blank(lines[i]) && lines[i].includes('|'))
          rows.push(this.cells(lines[i++]));
        out.push('<table><thead><tr>' +
          header.map((c) => `<th>${this.inline(c)}</th>`).join('') +
          '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' +
            r.map((c) => `<td>${this.inline(c)}</td>`).join('') + '</tr>').join('') +
          '</tbody></table>');
        continue;
      }
      if (/^\s*[-*+]\s+/.test(l)) {
        const items = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i]))
          items.push(lines[i++].replace(/^\s*[-*+]\s+/, ''));
        out.push('<ul>' + items.map((x) => `<li>${this.inline(x)}</li>`).join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+\.\s+/.test(l)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i]))
          items.push(lines[i++].replace(/^\s*\d+\.\s+/, ''));
        out.push('<ol>' + items.map((x) => `<li>${this.inline(x)}</li>`).join('') + '</ol>');
        continue;
      }
      const para = [];
      while (i < lines.length && !blank(lines[i]) && !blockStart(lines[i], i))
        para.push(lines[i++]);
      out.push(`<p>${para.map((p) => this.inline(p)).join('<br>')}</p>`);
    }
    return out.join('\n');
  },
  // ---- chat 1件分のメッセージ HTML（agent/thought/plan は Markdown 描画） ----
  mdRole(r) { return r === 'agent' || r === 'thought' || r === 'plan'; },
  msg(m, editable) {
    const body = this.mdRole(m.role) ? this.md(m.text) : esc(m.text);
    const cls = this.mdRole(m.role) ? `${m.role} md` : m.role;
    const edit = editable
      ? `<span class="edit" onclick="startRevise()" title="${esc(t('edit.tip'))}">${esc(t('edit.label'))}</span>`
      : '';
    return `<div class="msg ${cls}">${body}<span class="time">${fmtTm(m.ts)}${edit}</span></div>`;
  },
  // ---- mermaid（```mermaid ブロックと .mmd 本文を図として描画） ----
  // CDN から lazy import。失敗時・構文エラー時はソース表示のまま残す
  _mp: null,
  _mermaid() {
    return this._mp ||= import(
      'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
      .then((m) => {
        m.default.initialize({ startOnLoad: false, securityLevel: 'strict' });
        return m.default;
      })
      .catch(() => { this._mp = null; return null; });  // 失敗はキャッシュせず次回リトライ
  },
  async drawMermaid(root) {
    const nodes = [...root.querySelectorAll('pre.mermaid:not([data-processed])')];
    if (!nodes.length) return;
    const m = await this._mermaid();
    if (!m) return;
    for (const n of nodes) {
      try { await m.run({ nodes: [n] }); } catch { /* 壊れた図はソース表示のまま */ }
    }
  },
  // ---- .mmd の縦横切替（表示のみ。ファイルは変更しない） ----
  // flowchart/graph は宣言行の方向指定を、stateDiagram は direction 行を反転する。
  // mmdAlt は path → 反転済みソース。縦⇄横ボタンで往復させる
  mmdAlt: new Map(),
  // frontmatter（--- title: ... ---）を除いた図本文を返す
  _mmdBody(src) {
    const fm = /^---\s*\n[\s\S]*?\n---\s*\n?/.exec(String(src ?? ''));
    return fm ? String(src).slice(fm[0].length) : String(src ?? '');
  },
  // 現在の向き: 'v'（縦）/ 'h'（横）/ null（切替対象外の図種）
  mmdOrient(src) {
    const body = this._mmdBody(src);
    const f = /^[ \t]*(?:flowchart|graph)[ \t]+(TB|TD|BT|RL|LR)\b/m.exec(body);
    if (f) return /^(LR|RL)$/.test(f[1]) ? 'h' : 'v';
    if (/^[ \t]*stateDiagram(?:-v2)?[ \t]*$/m.test(body)) {
      const d = /^[ \t]*direction[ \t]+(TB|TD|BT|RL|LR)\b/m.exec(body);
      return d && /^(LR|RL)$/.test(d[1]) ? 'h' : 'v';  // direction 無しは TB（縦）
    }
    return null;
  },
  mmdFlipped(src) {
    const s = String(src ?? '');
    const o = this.mmdOrient(s);
    if (!o) return s;
    const fm = /^---\s*\n[\s\S]*?\n---\s*\n?/.exec(s);
    const head = fm ? fm[0] : '';
    let body = s.slice(head.length);
    const next = o === 'v' ? 'LR' : 'TB';
    if (/^[ \t]*(?:flowchart|graph)[ \t]+(?:TB|TD|BT|RL|LR)\b/m.test(body)) {
      body = body.replace(/^([ \t]*(?:flowchart|graph)[ \t]+)(?:TB|TD|BT|RL|LR)\b/m, `$1${next}`);
    } else if (/^[ \t]*direction[ \t]+(?:TB|TD|BT|RL|LR)\b/m.test(body)) {
      body = body.replace(/^([ \t]*direction[ \t]+)(?:TB|TD|BT|RL|LR)\b/m, `$1${next}`);
    } else {
      body = body.replace(/^([ \t]*stateDiagram(?:-v2)?[ \t]*)$/m, `$1\n    direction ${next}`);
    }
    return head + body;
  },
  // ---- mermaid 図の拡大縮小（表示のみ。＋−ボタン / Ctrl+wheel / ドラッグで視野移動） ----
  // 図はベクタなので svg の width/height を viewBox 基準の倍率で書き換える。
  // 縮小時は 100% 未満にもできる（max-width:100% の既定より小さく表示）
  zoom: 1,
  _zpath: null,                            // zoom を保持する doc path（切替で等倍に戻す）
  mmdZoom(d) {
    this.zoom = d === 0 ? 1
      : Math.min(10, Math.max(0.05, this.zoom * (d > 0 ? 1.25 : 0.8)));
    this._applyZoom();
  },
  _applyZoom() {
    const z = document.getElementById('vw-zv');
    if (z) z.textContent = Math.round(this.zoom * 100) + '%';

            : prev && kind === 'html'

// ---------- カレントリポジトリ（左ペインの選択が全表示のスコープ） ----------
let repoScope = localStorage.getItem('kasugai:repo') || '';   // '' は repos 未設定時のみ
const repoSlugOf = (r) => typeof r === 'string' ? r : (r?.slug ?? r?.github ?? '');
const matchRepo = (r) => !repoScope || repoSlugOf(r) === repoScope;
const repoQuery = () => repoScope ? '?repo=' + encodeURIComponent(repoScope) : '';
// slug → [owner, name]（'/' 無しは owner=''）。owner/repo の2セレクトで選択
const splitSlug = (s) => {
  const i = s.indexOf('/');
  return i > 0 ? [s.slice(0, i), s.slice(i + 1)] : ['', s];
};
const joinSlug = (o, n) => o ? o + '/' + n : n;
let repoOwner = splitSlug(repoScope)[0];   // カレント owner 選択
const scopeFromSelects = () =>
  joinSlug(repoOwner, document.getElementById('repo-name').value);
// path が属する登録 repo の slug（最長一致。どの repo 配下でもなければ null）
const normPath = (p) =>
  String(p ?? '').replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
const pathRepoSlug = (p) => {
  const n = normPath(p);
  let best = null;
  for (const r of repos) {
    const root = normPath(r.path);
    if (root && (n === root || n.startsWith(root + '/')) &&
        (!best || root.length > normPath(best.path).length)) best = r;
  }
  return best ? repoSlugOf(best) : null;
};
// issue.repo は slug または path（local-health は slug 無し時 path）。
// 選択 repo の slug/path どちらかに一致すればカレント扱い（matchRepo 相当）
const matchIssue = (i) => {
  const ir = String(i?.repo ?? i?.slug ?? '');
  if (!repoScope || ir === repoScope) return true;
  const sel = repos.find((r) => repoSlugOf(r) === repoScope);
  return !!sel && normPath(ir) === normPath(sel.path);
};
// issue.repo → 登録 repo（requirePushApproval 等の判定用。slug/path 両方で照合）
const repoOfIssue = (i) => {
  const ir = String(i?.repo ?? i?.slug ?? '');
  return repos.find((r) =>
    repoSlugOf(r) === ir || (ir && normPath(r.path) === normPath(ir)));
};
async function applyRepoScope(refreshCenter = true) {  // repoScope 確定後の全ペイン反映
  localStorage.setItem('kasugai:repo', repoScope);
  const wasCenter = centerMode;    // sideView('chats') が centerMode を戻すので退避
  const wasProp = curPropId;       // 同上（exitDoc が null にするので退避）
  await loadSessions();        // sel のスコープ外解除
  treeSel = '';              // ツリーの選択・展開・取得キャッシュは旧 repo のものなので解除
  treeKids.clear(); treeOpen.clear();
  if (refreshCenter) sideView(sideMode);  // 右ペイン doc browser（再取得）
  else renderSide();         // boardOpen 等で中央遷移を別途制御する場合は一覧のみ更新
  loadMgmt();                // 右ペイン管理セクション
  if (sideMode === 'editor') renderTree();
  if (!refreshCenter) return;
  if (wasCenter === 'status') showStatus();
  else if (wasCenter === 'settings') showSettings();
  // proposal 詳細は repo 非依存なので切替後も表示を維持する
  else if (wasCenter === 'proposal' && wasProp) openProposal(wasProp);
  // doc viewer が他 repo 配下のファイルを表示中なら閉じて chat 表示へ戻す
  // （repo 非所属の global doc は残す。agents/skills 側は sideView が先頭
  //   doc を開き直すので実質 editor 表示の救済）
  else if (wasCenter === 'doc' && curDoc?.path &&
           pathRepoSlug(curDoc.path) && pathRepoSlug(curDoc.path) !== repoScope) {
    exitDoc(); loadChat();
  }
  else if (sel == null) renderEmpty();
}

// コンテキスト消費量（usage {used,size?,cost?}。usage_update 由来、
// size 不明な実行体は使用数のみ。cost は累積セッションコスト）
const ctxPct = (u) => (u && u.size ? Math.round((u.used / u.size) * 100) : null);
const ctxK = (n) =>
  (n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n));
const ctxText = (u) => {                 // 詳細表示 "53k/200k (26%) · $0.045"
  if (!u || u.used == null) return '';
  const p = ctxPct(u);
  let s = u.size ? `${ctxK(u.used)}/${ctxK(u.size)} (${p}%)` : ctxK(u.used);
  if (u.cost && u.cost.amount != null)
    s += ` · ${u.cost.currency === 'USD' ? '$' : (u.cost.currency ? u.cost.currency + ' ' : '')}${u.cost.amount}`;
  return s;
};
const ctxShort = (u) =>                  // 短縮表示 "26%"（size 不明時は "12k"）
  (u && u.used != null ? (ctxPct(u) != null ? ctxPct(u) + '%' : ctxK(u.used)) : '');
const ctxPill = (s) =>
  (s.usage ? ` <span class="pill ctx" title="${esc(t('ctx.label') + ' ' + ctxText(s.usage))}">ctx ${esc(ctxShort(s.usage))}</span>` : '');

function addFiles(fs) {
  for (const f of fs || []) {
    const fr = new FileReader();
    fr.onload = () => { files.push({ name: f.name || '', data: fr.result }); renderImgs(); };
    fr.readAsDataURL(f);

}
function onPaste(e) {

    if (it.kind !== 'file') continue;
    const f = it.getAsFile(); if (f) fs.push(f);
  }
  if (fs.length) { e.preventDefault(); addFiles(fs); }
}

async function send() {

  let text = el.value.trim();
  if (!text && !files.length) return;
  if (files.length) {
    const aj = await J('POST', '/api/chat/attach', { attachments: files });

      (aj.files || []).map((f) => '[添付] ' + f.name + ' → ' + f.path).join('\n');

// 復元ポイント（turn 単位）を選んで、その時点以降のファイル変更を元へ戻す
async function chatRestore() {
  if (sel == null) return;
  const j = await J('GET', '/api/chat?id=' + sel);
  const pts = (j.snapPoints || []).slice().sort((a, b) => a.turn - b.turn);
  if (!pts.length) { alert(t('restore.none')); return; }
  const short = (f) => String(f).split('/').slice(-2).join('/');
  const lines = pts.map((p, i) =>
    `${i + 1}. ` + t('restore.line',
      { prompt: p.prompt || t('restore.sentFallback'), count: p.files.length }));
  const pick = prompt(t('restore.pick', { lines: lines.join('\n') }), '');
  if (pick == null) return;
  const n = parseInt(pick, 10);
  const turn = Number.isFinite(n) && pts[n - 1] ? pts[n - 1].turn : undefined;
  const files = [...new Set(pts.filter((p) => turn == null || p.turn >= turn)
    .flatMap((p) => p.files))].map(short);
  if (!confirm(t('restore.confirm', { files: files.join('\n') }))) return;
  const r = await J('POST', '/api/chat/restore', { id: sel, turn });
  if (!r.ok) { alert(t('restore.fail', { error: r.error || '' })); return; }
  alert(t('restore.result', { restored: r.restored.length, deleted: r.deleted.length }) +
    (r.failed.length ? t('restore.failedSuffix', { count: r.failed.length }) : ''));
  loadChat();
}

// ---------- 中央ペインの表示モード（chat / doc / status / settings / manual / proposal / candidate / issue） ----------
let centerMode = 'chat';            // 'chat' | 'doc' | 'status' | 'settings' | 'manual' | 'proposal' | 'candidate' | 'issue'

// ---------- 処理状況（中央ペイン: 状態別カンバン列） ----------
// 列定義: [key, pill の色クラス, 表示名]。chat は現在地の列へカードとして置く。
// exec 列は busy/waiting を統合し、カード側のピルで実行中/実行待機中を明示する
const STATUS_COLS = [
  ['idle',   '',       'board.idle'],
  ['exec',   'run',    'board.exec'],
  ['verify', 'ver',    'board.verify'],
  ['resume', 'resume', 'board.resume'],
  ['unresolved', 'unres', 'board.unresolved'],
  ['live',   'live',   'board.live'],
];
// 接続中の完了セッションは終了区分で分岐: 要対応（検証NG=ng /
// verdict未取得=unverified / 差し戻し再送待ち・要人対応）のみ unresolved。
// 実装完了(doneKind=done)と無印（実装ターンを経ずに終了）は live へ
const statusKey = (s) =>
  s.verify ? 'verify' : s.backPending || s.needsHuman ? 'unresolved'
    : s.waiting || s.busy ? 'exec'
    : s.live ? (s.doneKind === 'ng' || s.doneKind === 'unverified' ? 'unresolved' : 'live')
    : s.resumable ? 'resume' : 'idle';
const doneKindLabel = (k) =>
  t('board.kind.' + (['done', 'ng', 'unverified'].includes(k) ? k : 'none'));
// セッションを列キーで仕分け。列内はカレント repo 優先、
// exec 列は実行中 → 実行待機中の順（ページングもこの並びを使う）
const byStatus = (list) => {
  const by = Object.fromEntries(STATUS_COLS.map(([k]) => [k, []]));
  for (const s of list) by[statusKey(s)].push(s);
  const cur = (s) => (matchRepo(s.repo) ? 1 : 0);
  for (const k in by) by[k].sort((a, b) => cur(b) - cur(a));
  by.exec.sort((a, b) => (b.busy ? 1 : 0) - (a.busy ? 1 : 0) || cur(b) - cur(a));
  return by;
};
// chat ヘッダ・タイトル前の状態ピル。ボード列と同じ色で、列内の詳細状態
// （実行中/実行待機中・検証中/検証待ち・終了区分）を表示する
const STATUS_PILL_CLS = Object.fromEntries(STATUS_COLS.map(([k, c]) => [k, c]));
const statusPillHtml = (s) => {
  const k = statusKey(s);
  const wk = s.waitInfo?.kind || s.waiting?.kind;  // sessions=waitInfo / 単体=waiting オブジェクト
  const label =
    k === 'exec' ? (s.busy ? t('board.running')
        : wk === 'repo' ? t('board.waitConfirm') : t('board.waiting'))
    : k === 'verify' ? (s.verify === 'running' ? t('board.verifying') : t('board.verifyPending'))
    : k === 'unresolved'
      ? doneKindLabel(s.doneKind) + (s.needsHuman ? ' · ' + t('board.needsHuman') : '')
    : t('board.' + k);
  return `<span class="pill ${STATUS_PILL_CLS[k]}" title="${esc(t('board.' + k))}">${esc(label)}</span>`;
};
async function showStatus() {
  centerMode = 'status';
  const j = await J('GET', '/api/chat/sessions');
  // 取得中に他ビューへ遷移した場合（＋新規チャット等）は描画しない
  if (centerMode !== 'status') return;
  // 処理状況は全 repo を表示し、カレント repo のカードを各列の先頭に並べる
  const list = (j.sessions || []);
  curDoc = null;
  curPropId = null;
  curItemKey = null;
  document.getElementById('main').classList.add('doc');
  document.getElementById('box').classList.remove('htmlview');
  document.getElementById('viewsw').style.display = 'none';
  renderSide();
  const by = byStatus(list);
  document.getElementById('ctitle').textContent = t('nav.status');
  document.getElementById('status').textContent = t('board.total', { count: list.length });
  const short = (f) => String(f).split('/').slice(-2).join('/');
  const card = (s) => {
    const slug = repoSlugOf(s.repo);
    const k = statusKey(s);
    // × は全カードに置く（chat 削除の入口）。右下にアクションボタンが
    // あるカードでは右上へ逃がす
    const hasAct = k === 'resume' || k === 'idle' || k === 'unresolved' ||
                   (k === 'verify' && s.verify === 'pending');
    return `<div class="bcard" onclick="boardOpen(${s.id},'${esc(slug)}')">` +
    `<span class="bx${hasAct ? ' t' : ''}" title="${esc(t('board.close.tip'))}" onclick="event.stopPropagation();boardClose(${s.id})">×</span>` +
    (k === 'resume'
      ? `<button class="bact" title="${esc(t('board.resume.tip'))}" onclick="event.stopPropagation();boardResume(${s.id})">${esc(t('board.resume.btn'))}</button>`
      : '') +
    (k === 'idle'
      ? `<button class="bact" title="${esc(t('board.start.tip'))}" onclick="event.stopPropagation();boardResume(${s.id})">${esc(t('board.start.btn'))}</button>`
      : '') +
    (k === 'verify' && s.verify === 'pending'
      ? `<button class="bact" title="${esc(t('board.verify.tip'))}" onclick="event.stopPropagation();boardVerify(${s.id})">${esc(t('board.verify.btn'))}</button>`
      : '') +
    (k === 'unresolved'
      ? `<button class="bact" title="${esc(t('board.rework.tip'))}" onclick="event.stopPropagation();boardRework(${s.id})">${esc(t('board.rework.btn'))}</button>`
      : '') +
    `<div><b>${s.parent != null ? '↳ ' : ''}${esc(s.label)}</b>` +
    (slug && slug !== repoScope ? ` <span class="pill repo">${esc(slug)}</span>` : '') +
    (s.execMode === 'parallel' ? ` <span class="pill par">${esc(t('exmode.parallel'))}</span>` : '') +
    (k === 'exec'
      ? ` <span class="pill run">${s.busy ? esc(t('board.running')) : s.waitInfo?.kind === 'repo' ? esc(t('board.waitConfirm')) : esc(t('board.waiting'))}</span>` +
        (s.verifyBack ? ` <span class="pill ver" title="${esc(t('board.verifyBack.tip'))}">${esc(t('board.verifyBack', { count: s.verifyBack }))}</span>` : '')
      : '') +
    (k === 'verify'
      ? ` <span class="pill ver">${s.verify === 'running' ? esc(t('board.verifying')) : esc(t('board.verifyPending'))}</span>`
      : '') +
    (k === 'unresolved'
      ? ` <span class="pill unres">${esc(doneKindLabel(s.doneKind))}</span>` +
        (s.needsHuman
          ? ` <span class="pill unres" title="${esc(t('board.needsHuman.tip'))}">${esc(t('board.needsHuman'))}</span>`
          : '') +
        (s.backPending
          ? ` <span class="pill ver" title="${esc(t('board.reworkWait.tip'))}">${esc(t('board.reworkWait', { count: s.verifyBack }))}</span>`
          : '')
      : '') +
    ctxPill(s) +
    `</div>` +
    `<div class="muted">#${s.id} · ${esc(fmtTs(s.updatedAt))}</div>` +
    (k === 'idle' && s.heldPrompts
      ? `<div class="muted">${esc(t('board.held', { count: s.heldPrompts }).trim())}</div>`
      : '') +
    (s.waitInfo?.kind === 'repo'
      ? `<div class="muted">${esc(t('board.repoWait', { slug: s.waitInfo.suggest?.slug ?? '?' }))}</div>`
      : s.waitInfo
      ? `<div class="muted">${esc(t('board.conflict', {
          files: s.waitInfo.files.map(short).join(', '),
          chats: s.waitInfo.blockedBy.map((b) => '#' + b).join(',') }))}` +
        (s.waitInfo.held ? esc(t('board.held', { count: s.waitInfo.held })) : '') + `</div>`
      : '') +
    `</div>`;
  };
  // 停止中の判定は server の resume-all と同じ順で数える:
  // busy → 対象外 / verify=pending → 検証起動 / 待機で blocker 全非busy → 解放
  // / それ以外で resumable → 再接続+続行 / idle(acp) → 起動+保留再送。
  // repo 確認待ちは人ゲートなので除外
  const byId = new Map(list.map((s) => [s.id, s]));
  const stopped = list.filter((s) => {
    if (s.busy || s.needsHuman) return false;
    if (s.backPending) return true;
    if (s.verify === 'pending') return true;
    if (s.waiting) return s.waitInfo?.kind !== 'repo' &&
      !(s.waitInfo?.blockedBy || []).some((b) => byId.get(b)?.busy);
    const k = statusKey(s);
    return k === 'resume' || (k === 'idle' && s.agentType === 'acp');
  });
  // 空列は .empty（半分幅）、2件以上は .many + 件数比例の flex-grow で
  // 広げ、カードを多段グリッドにする（幅不足時は auto-fill で1列に戻る）
  const col = ([k, pill, name]) => {
    const n = by[k].length;
    const cls = n === 0 ? ' empty' : n >= 2 ? ' many' : '';
    const grow = n >= 2 ? ` style="flex-grow:${Math.min(n, 4)}"` : '';
    return `<div class="bcol${cls}"${grow}><div class="bhead"><span class="pill ${pill}">${esc(t(name))}</span>` +
    (k === 'live' && by.live.length
      ? `<button class="bxall" title="${esc(t('board.closeAll.tip'))}" onclick="boardCloseAll(${by.live.length})">${esc(t('board.closeAll.btn'))}</button>`
      : '') +
    `<span class="n">${n}</span></div>` +
    `<div class="bcards">${by[k].map(card).join('') || `<div class="empty">${esc(t('board.empty'))}</div>`}</div></div>`;
  };
  document.getElementById('box').innerHTML =
    `<div id="boardwrap"><div class="btools">` +
    `<button onclick="newChat()" title="${esc(t('head.newChat.tip'))}">${esc(t('head.newChat'))}</button>` +
    `<button onclick="boardResumeAll(${stopped.length})"${stopped.length ? '' : ' disabled'}` +
    ` title="${esc(t('board.resumeAll.tip'))}">${esc(t('board.resumeAll.btn'))}` +
    (stopped.length ? ` (${stopped.length})` : '') + `</button>` +
    `<span class="muted">${esc(t('board.resumeAll.note'))}</span></div>` +
    `<div id="board">${STATUS_COLS.map(col).join('')}</div></div>`;
  document.getElementById('box').scrollTop = 0;
}

function renderSettings() {

  const card = (e, i) => {
    const badges =
      (e.ide ? `<span class="pill live">${esc(t('repo.ide'))}</span>` : '') +
      (e.user ? `<span class="pill">${esc(t('repo.user'))}</span>` : '') +
      (e.registered ? `<span class="pill">${esc(t('repo.registered'))}</span>`
                    : `<span class="pill wait">${esc(t('repo.unregistered'))}</span>`);
    const cur = e.slug && e.slug === repoScope
      ? `<span class="pill resume">${esc(t('repo.current'))}</span>` : '';
    const body = e.registered
      ? `<div class="rset">` +
        `<label><input type="checkbox" id="r-pa-${i}"${e.requirePushApproval ? ' checked' : ''}>requirePushApproval</label>` +

        `<button onclick="removeRepo(${i})">${esc(t('repo.unregister'))}</button></div>`
      : `<div class="rset"><button class="primary" onclick="regIdeRepo(${i})">${esc(t('repo.watch'))}</button></div>`;
    return `<div class="rcard">` +
      `<div><b>${esc(e.slug ?? base(e.path))}</b> ${badges}${cur}</div>` +
      `<div class="muted">${esc(e.path)}</div>${body}</div>`;
  };
  // 接続AI セクション。active が新規 chat の実行体。
  // フィールドは type 別: acp=exe/args/auth、agent|openai=endpoint/provider/model/token
  const acard = (a, i) => {
    const act = a.id === activeAgent;
    const detail = a.type === 'acp'
      ? `${esc(a.exe)} ${esc((a.args || []).join(' '))} · auth=${esc(a.auth)}`
      : `${esc(a.endpoint)}` +
        (a.provider ? ` · ${esc(a.provider)}` : '') +
        (a.model ? ` · ${esc(a.model)}` : '') +
        (a.hasToken ? ` · ${esc(t('agent.tokenSet'))}` : '');
    const fields = a.type === 'acp'
      ? `<label>exe<input type="text" class="wide" id="a-exe-${i}" value="${esc(a.exe)}"></label>` +
        `<label>args<input type="text" id="a-args-${i}" value="${esc((a.args || []).join(' '))}"></label>` +
        `<label><input type="checkbox" id="a-auth-${i}"${a.auth === 'devin' ? ' checked' : ''}>${esc(t('agent.devinAuth'))}</label>`
      : `<label>endpoint<input type="text" class="wide" id="a-ep-${i}" value="${esc(a.endpoint)}"></label>` +
        (a.type === 'agent'
          ? `<label>provider<input type="text" id="a-pr-${i}" value="${esc(a.provider)}"></label>` : '') +
        `<label>model<input type="text" id="a-mo-${i}" value="${esc(a.model)}"></label>` +
        `<label>token<input type="password" id="a-tk-${i}"` +
        ` placeholder="${esc(t(a.hasToken ? 'agent.tokenSetPh' : 'agent.tokenUnsetPh'))}"></label>`;
    return `<div class="rcard">` +
      `<div><b>${esc(a.label)}</b> <span class="pill">${esc(a.id)}</span>` +
      `<span class="pill">${esc(a.type)}</span>` +
      (act ? `<span class="pill live">${esc(t('agent.active'))}</span>` : '') + `</div>` +
      `<div class="muted">${detail}</div>` +
      `<div class="rset">${fields}` +
      `<button class="primary" onclick="saveAgent(${i})">${esc(t('common.save'))}</button>` +
      (act ? '' :
        `<button onclick="setAgentActive('${esc(a.id)}')">${esc(t('agent.activate'))}</button>` +
        `<button onclick="removeAgent(${i})">${esc(t('agent.remove'))}</button>`) +
      `</div></div>`;
  };
  const agentReg =
    `<div class="rcard"><b>${esc(t('agent.regTitle'))}</b>` +
    `<div class="rset" id="agent-reg-fields">` +
    `<label>${esc(t('agent.type'))}<select id="set-agent-type" onchange="agentTypeUI()">` +
    `<option value="acp">${esc(t('agent.typeAcp'))}</option>` +
    `<option value="agent">${esc(t('agent.typeAgent'))}</option>` +
    `<option value="openai">${esc(t('agent.typeOpenai'))}</option></select></label>` +
    `<label>id<input type="text" id="set-agent-id" placeholder="claude"></label>` +
    `<label>${esc(t('agent.label'))}<input type="text" id="set-agent-label" placeholder="Claude"></label>` +
    `<label data-t="acp">exe<input type="text" class="wide" id="set-agent-exe" placeholder="C:/path/to/agent.exe"` +
    ` onkeydown="if(event.key==='Enter')regAgent()"></label>` +
    `<label data-t="acp">args<input type="text" id="set-agent-args" placeholder="acp"` +
    ` onkeydown="if(event.key==='Enter')regAgent()"></label>` +
    `<label data-t="acp"><input type="checkbox" id="set-agent-auth">${esc(t('agent.devinAuth'))}</label>` +
    `<label data-t="agent openai">endpoint<input type="text" class="wide" id="set-agent-endpoint"` +
    ` placeholder="${esc(t('agent.endpointPh'))}"` +
    ` onkeydown="if(event.key==='Enter')regAgent()"></label>` +
    `<label data-t="agent">provider<input type="text" id="set-agent-provider"` +
    ` placeholder="copilot / devin / antigravity"></label>` +
    `<label data-t="agent openai">model<input type="text" id="set-agent-model"` +
    ` placeholder="${esc(t('agent.modelPh'))}"></label>` +
    `<label data-t="agent openai">token<input type="password" id="set-agent-token"` +
    ` placeholder="${esc(t('agent.tokenPh'))}"></label>` +
    `<button class="primary" onclick="regAgent()">${esc(t('common.register'))}</button></div>` +
    `<div class="muted">${esc(t('agent.regNote'))}</div></div>`;
  // システムタブ（control 自身の情報と再起動ボタン）
  const sysCard =
    `<div class="rcard"><b>${esc(t('sys.title'))}</b>` +
    `<div class="muted">version ${esc(sysState.version ?? '-')} · port ${esc(sysState.port ?? '-')} · ` +
    `uptime ${esc(fmtDur(sysState.uptime))}</div>` +
    (sysState.restartPending
      ? `<div class="muted">${esc(t('sys.restartPending'))}</div>` : '') +
    `<div class="rset"><button onclick="sysRestart(false)"` +
    ` title="${esc(t('sys.restart.tip'))}">${esc(t('sys.restart'))}</button>` +
    `<button onclick="sysRestart(true)"` +
    ` title="${esc(t('sys.restartForce.tip'))}">${esc(t('sys.restartForce'))}</button>` +
    `<span class="muted" id="restart-note"></span></div>` +
    `<div class="muted">${esc(t('sys.restartNote'))}</div></div>`;
  // 自動起動カード（HKCU Run キー KasugaiAgentDispatcher の登録/解除）
  const as = sysState.autostart || {};
  const autoCard =
    `<div class="rcard"><b>${esc(t('autostart.title'))}</b>` +
    `<div class="muted">` +
    (as.installed
      ? `<span class="pill live">${esc(t('autostart.installed'))}</span>`
      : `<span class="pill">${esc(t('autostart.notInstalled'))}</span>`) +
    ` <span class="muted">${esc(as.task ?? 'KasugaiAgentDispatcher')}</span>` +
    (as.cmd ? ` <span class="muted">${esc(as.cmd)}</span>` : '') + `</div>` +
    `<div class="rset">` +
    (as.installed
      ? `<button onclick="autostartSet(false)">${esc(t('autostart.uninstall'))}</button>`
      : `<button class="primary" onclick="autostartSet(true)">${esc(t('autostart.install'))}</button>`) +
    `</div>` +
    `<div class="muted">${esc(t('autostart.note'))}</div></div>`;
  // 時刻表示カード（IANA タイムゾーン名。空欄=ブラウザ既定）
  const tzCard =
    `<div class="rcard"><b>${esc(t('tz.title'))}</b>` +
    `<div class="muted">${esc(t('tz.now', { tz: tzName() }))}: ${esc(fmtTs(new Date().toISOString()))}</div>` +
    `<div class="rset"><label>${esc(t('tz.label'))}` +
    `<input type="text" id="tz-input" list="tz-list" value="${esc(dispTz)}"` +
    ` placeholder="${esc(tzAuto())}"` +
    ` onkeydown="if(event.key==='Enter')saveTz()"></label>` +
    `<datalist id="tz-list">` +
    [...new Set([tzAuto(), dispTz, ...TZ_CHOICES].filter(Boolean))]
      .map((z) => `<option value="${esc(z)}">`).join('') +
    `</datalist>` +
    `<button class="primary" onclick="saveTz()">${esc(t('common.save'))}</button></div>` +
    `<div class="muted">${esc(t('tz.note'))}</div></div>`;
  // アセット更新カード（CDN 配布: /api/state.assets）
  const assetCardHtml = assetsCard();
  // 先頭カードは任意パスの登録フォーム。登録はすべてこのビューで行う
  const regCard =
    `<div class="rcard"><b>${esc(t('repo.regTitle'))}</b>` +
    `<div class="rset">` +
    `<label>path<input type="text" class="wide" id="set-repo-path" placeholder="C:/devin/xxx"` +
    ` onkeydown="if(event.key==='Enter')regNewRepo()"></label>` +
    `<button onclick="openDirPick()" title="${esc(t('repo.browse.tip'))}">${esc(t('repo.browse'))}</button>` +
    `<label>slug<input type="text" id="set-repo-slug" placeholder="${esc(t('repo.slugPh'))}"` +
    ` onkeydown="if(event.key==='Enter')regNewRepo()"></label>` +
    `<button class="primary" onclick="regNewRepo()">${esc(t('common.register'))}</button></div>` +
    `<div class="muted">${esc(t('repo.regNote'))}</div></div>`;
  // 3タブにグループ分け: 接続AI（既定）/ リポジトリ / システム

  if (!tabs.some(([id]) => id === setTab)) setTab = 'agents';
  const tabbar = `<div class="stabs">` + tabs.map(([id, lbl]) =>
    `<button class="stab${setTab === id ? ' active' : ''}"` +
    ` onclick="setSettingsTab('${id}')">${lbl}</button>`).join('') + `</div>`;
  // リポジトリタブ: GitHub owner / ユーザー / (owner なし) のサブタブで絞込。
  // グループ順は owner（出現順）→ user → local。カードの index は
  // repoRows 上の位置を維持する（saveRepo 等の行参照用）
  const gRank = (g) => g === 'user' ? 1 : g === 'local' ? 2 : 0;
  const repoGroups = [...new Set(repoRows.map(repoGroupKey))]
    .sort((a, b) => gRank(a) - gRank(b));
  if (!repoGroups.includes(repoTab)) repoTab = repoGroups[0] ?? '';
  const subTabs = repoGroups.length > 1
    ? `<div class="stabs sub">` + repoGroups.map((g) =>
        `<button class="stab${repoTab === g ? ' active' : ''}"` +

        `${esc(repoGroupLabel(g))}` +
        ` (${repoRows.filter((e) => repoGroupKey(e) === g).length})</button>`
      ).join('') + `</div>`
    : '';
  const body = setTab === 'repos'
    ? regCard + subTabs + (repoRows.length
        ? `<div class="rgrid">` + repoRows
            .map((e, i) => repoGroupKey(e) === repoTab ? card(e, i) : '')
            .join('') + `</div>`
        : `<div class="empty">${esc(t('repo.none'))}</div>`)
    : setTab === 'system'
      ? sysCard + autoCard + tzCard + assetCardHtml + silencesCard()
      : agentReg + (agentRows.length
          ? agentRows.map(acard).join('') : `<div class="empty">${esc(t('agent.none'))}</div>`);
  document.getElementById('box').innerHTML = tabbar + body;
  agentTypeUI();
  document.getElementById('box').scrollTop = 0;
}
// 登録フォームの型（data-t 属性）で入力欄を出し分ける

// ---------- アセット更新（CDN 配布: /api/assets*。表示は /api/state.assets） ----------
function assetsCard() {
  const a = sysState.assets || {};
  const chs = a.channels || {};
  const names = Object.keys(chs);
  const row = (ch) => {
    const c = chs[ch];
    const state = a.needsExe
      ? `<span class="pill">${esc(t('assets.needExe', { v: a.needsExe }))}</span>`
      : (c.held && c.held === c.latest)
        ? `<span class="pill">${esc(t('assets.held'))}</span>`
        : c.update
          ? (c.autoApply
            ? `<span class="pill live">${esc(t('assets.update'))}</span>`
            : `<span class="pill">${esc(t('assets.gated'))}</span>`)
          : `<span class="pill">${esc(t('assets.uptodate'))}</span>`;
    const gp = c.gatedProposal && c.gatedProposal.proposalId
      ? ` <span class="muted">${esc(t('assets.proposal', { id: c.gatedProposal.proposalId }))}</span>` : '';
    const btns =
      (c.update && !a.needsExe
        ? `<button onclick="assetsApply('${esc(ch)}')">${esc(t('assets.apply'))}</button>` : '') +
      (c.hasBackup
        ? `<button onclick="assetsRollback('${esc(ch)}')">${esc(t('assets.rollback'))}</button>` : '');
    return `<div class="muted"><b>${esc(ch)}</b> ` +
      `${esc(c.installed ?? '-')} → ${esc(c.latest ?? '-')} ${state}${gp}` +
      (c.error ? ` <span class="pill">${esc(c.error)}</span>` : '') +
      (btns ? ` <span class="rset" style="display:inline-flex">${btns}</span>` : '') +
      `</div>`;
  };
  return `<div class="rcard"><b>${esc(t('assets.title'))}</b>` +
    `<div class="muted">CDN: ${esc(a.cdnBaseUrl || t('assets.off'))}` +
    (a.lastCheckAt ? ` · ${esc(t('assets.lastCheck'))}: ${esc(fmtTs(a.lastCheckAt))}` : '') +
    (a.lastError ? ` · ${esc(t('assets.fail', { e: a.lastError }))}` : '') + `</div>` +
    (names.length ? names.map(row).join('') : `<div class="empty">${esc(t('assets.none'))}</div>`) +
    `<div class="rset"><button onclick="assetsCheck()" ${a.checking ? 'disabled' : ''}` +
    ` title="${esc(t('assets.check.tip'))}">${esc(a.checking ? t('assets.checking') : t('assets.check'))}</button></div>` +
    `<div class="muted">${esc(t('assets.note'))}</div></div>`;
}
// ---------- silence（起票ミュート: /api/silences。matcher+期限） ----------
// 窓内に matcher 合致する candidate は課題化せず deferred="silenced" で

    `<div class="rset">` +
    `<label>source<input type="text" id="sil-src" placeholder="*"></label>` +
    `<label>repo<input type="text" id="sil-repo" placeholder="*"></label>` +
    `<label>kind<input type="text" id="sil-kind" placeholder="*"></label>` +

    `<input type="number" id="sil-min" value="60" min="1"></label></div>` +

async function silRefresh() {
  const r = await J('GET', '/api/silences');
  silRows = (r && r.silences) || [];
  if (centerMode === 'settings' && setTab === 'system') renderSettings();
}
async function silAdd() {
  const v = (id) => (document.getElementById(id)?.value || '').trim();
  const matchers = {};
  if (v('sil-src')) matchers.source = v('sil-src');
  if (v('sil-repo')) matchers.repo = v('sil-repo');
  if (v('sil-kind')) matchers.kind = v('sil-kind');
  const r = await J('POST', '/api/silences', {
    matchers, comment: v('sil-comment'),
    durationMinutes: parseInt(v('sil-min'), 10) || 0,
  });
  if (!r.ok) { alert(t('alert.fail', { error: r.error || '' })); return; }
  await silRefresh();
}
async function silRemove(id) {
  const r = await J('POST', '/api/silences/remove', { id });
  if (!r.ok) { alert(t('alert.fail', { error: r.error || '' })); return; }
  await silRefresh();
}
async function assetsCheck() {
  const r = await J('POST', '/api/assets/check', {});
  if (!r.ok) { alert(t('alert.fail', { error: r.error || '' })); return; }
  sysState.assets = r;
  if (centerMode === 'settings' && setTab === 'system') renderSettings();
}
async function assetsApply(ch) {

}
async function assetsRollback(ch) {
  if (!confirm(t('assets.rollbackConfirm', { ch }))) return;
  const r = await J('POST', '/api/assets/rollback', { channel: ch });

}
async function sysRestart(force) {
  if (!confirm(force ? t('confirm.restartForce') : t('confirm.restart')))
    return;
  const r = await J('POST', '/api/control/restart', force ? { force: true } : {});
  if (!r.ok) { alert(t('alert.restartFail', { error: r.error || '' })); return; }
  showRestarting(!!r.pending, force);
}
// 自動起動（HKCU Run キー登録）の切替。応答の autostart で即時反映
async function autostartSet(on) {
  const r = await J('POST', '/api/control/autostart',
    { action: on ? 'install' : 'uninstall' });
  if (!r.ok) { alert(t('alert.fail', { error: r.error || '' })); return; }
  sysState.autostart = r.autostart;
  if (centerMode === 'settings' && setTab === 'system') renderSettings();
}
// 再起動の状態表示（最上部 #rban バナー + カード内 note。SSE restart からも呼ぶ）
let restartShown = false;
let restartState = { pending: false, forced: false };   // 言語切替時の再描画用
function showRestarting(pending, forced) {
  restartShown = true;
  restartState = { pending: !!pending, forced: !!forced };
  const el = document.getElementById('rban');
  el.style.display = '';
  el.textContent = pending
    ? t('banner.pending')
    : forced ? t('banner.forced') : t('banner.normal');
  const note = document.getElementById('restart-note');
  if (note) note.textContent = pending ? t('sys.pendingShort') : t('sys.restartingShort');
}
function clearRestarting() {
  restartShown = false;
  document.getElementById('rban').style.display = 'none';
}
async function regAgent() {
  const type = document.getElementById('set-agent-type').value;
  const body = {
    type,
    id: document.getElementById('set-agent-id').value.trim() || undefined,
    label: document.getElementById('set-agent-label').value.trim() || undefined,
  };
  if (type === 'acp') {
    body.exe = document.getElementById('set-agent-exe').value.trim();
    if (!body.exe) { alert(t('alert.exeRequired')); return; }
    body.args = document.getElementById('set-agent-args').value;
    body.auth = document.getElementById('set-agent-auth').checked ? 'devin' : 'none';
  } else {
    body.endpoint = document.getElementById('set-agent-endpoint').value.trim();
    if (!body.endpoint) { alert(t('alert.endpointRequired')); return; }
    if (type === 'agent')
      body.provider = document.getElementById('set-agent-provider').value.trim();
    body.model = document.getElementById('set-agent-model').value.trim();
    const tk = document.getElementById('set-agent-token').value;
    if (tk) body.token = tk;
  }
  const r = await J('POST', '/api/chat-agents', body);
  if (!r.ok) { alert(t('alert.regFail', { error: r.error || '' })); return; }
  showSettings();
}
async function saveAgent(i) {
  const a = agentRows[i];
  if (!a) return;
  const body = { id: a.id };
  if (a.type === 'acp') {
    body.exe = document.getElementById('a-exe-' + i).value;
    body.args = document.getElementById('a-args-' + i).value;
    body.auth = document.getElementById('a-auth-' + i).checked ? 'devin' : 'none';
  } else {
    body.endpoint = document.getElementById('a-ep-' + i).value;
    body.model = document.getElementById('a-mo-' + i).value;
    if (a.type === 'agent')
      body.provider = document.getElementById('a-pr-' + i).value;
    const tk = document.getElementById('a-tk-' + i).value;
    if (tk !== '') body.token = tk;    // 空欄は既存トークンを維持
  }
  const r = await J('POST', '/api/chat-agents/update', body);
  if (!r.ok) { alert(t('alert.saveFail', { error: r.error || '' })); return; }
  showSettings();

// mermaid 図の拡縮ボタン（d: +1=拡大 / -1=縮小 / 0=等倍）。実処理は Viewer 側
function mmdZoom(d) { Viewer.mmdZoom(d); }
// wheel 拡縮（カーソル位置を維持）とドラッグ視野移動を #box に委譲
// （pre.mermaid は描画ごとに作り直し）。図の上では wheel は常に拡縮になり、
// ページ送りはドラッグか図の外のホイールで行う
function initMmdZoom() {
  const box = document.getElementById('box');
  box.addEventListener('wheel', (e) => {
    const p = e.target.closest('pre.mermaid[data-processed]');
    if (!p) return;
    const svg = p.querySelector('svg');
    if (!svg) return;
    e.preventDefault();
    // カーソル下の図内点がズーム前後で動かないようスクロールを補正する
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const fx = (e.clientX - r.left) / r.width;
    const fy = (e.clientY - r.top) / r.height;
    Viewer.mmdZoom(e.deltaY < 0 ? 1 : -1);
    const n = svg.getBoundingClientRect();
    p.scrollLeft += (n.left + fx * n.width) - e.clientX;
    box.scrollTop += (n.top + fy * n.height) - e.clientY;
  }, { passive: false });
  box.addEventListener('mousedown', (e) => {
    const p = e.target.closest('pre.mermaid[data-processed]');
    if (!p || e.button !== 0) return;
    e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY, sl = p.scrollLeft, st = box.scrollTop;
    p.classList.add('pan');
    const mv = (ev) => {
      p.scrollLeft = sl - (ev.clientX - x0);
      box.scrollTop = st - (ev.clientY - y0);
    };
    const up = () => {
      p.classList.remove('pan');
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
}
