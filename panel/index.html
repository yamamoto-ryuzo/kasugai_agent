// ---------- エディター（右ペイン: カレント repo のフォルダツリー） ----------
// 1階層ずつ GET /api/fs/tree で lazy 展開。file クリックで GET /api/fs/file を
// 取り、中央ペインの doc viewer（enterDoc/Viewer）へ表示する
const treeKids = new Map();   // dir path -> 応答 | 'loading' | 'err'
const treeOpen = new Set();   // 展開中の dir path
let treeSel = '';             // 中央ペインに表示中の file path
let treeRows = [];            // 描画中の行 {kind, path, denied}
const treeRoot = () => repos.find((r) => r.slug === repoScope)?.path || '';
async function treeLoad(dir) {
  treeKids.set(dir, 'loading');
  const j = await J('GET', '/api/fs/tree?path=' + encodeURIComponent(dir));
  treeKids.set(dir, j.ok ? j : 'err');
  renderTree();
}
function treeReload() { treeKids.clear(); renderTree(); }
function treeClick(i) {
  const r = treeRows[i];
  if (!r || r.denied) return;
  if (r.kind === 'file') { openTreeFile(r.path); return; }
  if (treeOpen.has(r.path)) treeOpen.delete(r.path);
  else { treeOpen.add(r.path); if (!treeKids.has(r.path)) treeLoad(r.path); }
  renderTree();
}
function renderTree() {
  const box = document.getElementById('treebox');
  const root = treeRoot();
  if (!root) {
    box.innerHTML = `<div class="empty">${esc(t('tree.noRepo'))}</div>`;
    return;
  }
  if (!treeOpen.has(root) && !treeKids.has(root)) treeOpen.add(root); // 初回は根を展開
  treeRows = [];
  const rows = [];
  const emit = (dir, depth) => {
    const k = treeKids.get(dir);
    if (!k || k === 'loading' || k === 'err') {
      if (!k) treeLoad(dir);
      rows.push(`<div class="trow off" style="padding-left:${depth * 14}px">` +
        `<span class="tg"></span>` +
        `<span class="tn">${esc(k === 'err' ? t('tree.loadFail') : '…')}</span></div>`);
      return;
    }
    for (const d of k.dirs) {
      const i = treeRows.push({ kind: 'dir', path: d.path }) - 1;
      const open = treeOpen.has(d.path);
      rows.push(`<div class="trow" style="padding-left:${depth * 14}px"` +
        ` onclick="treeClick(${i})" data-tip="${esc(d.path)}">` +
        `<span class="tg">${open ? '▾' : '▸'}</span>` +
        `<span class="tn">${esc(d.name)}</span></div>`);
      if (open) emit(d.path, depth + 1);
    }
    for (const f of k.files) {
      const i = treeRows.push({ kind: 'file', path: f.path,
        denied: f.denied }) - 1;
      rows.push(`<div class="trow${f.denied ? ' off' : ''}` +
        `${f.path === treeSel ? ' sel' : ''}"` +
        ` style="padding-left:${depth * 14}px" onclick="treeClick(${i})"` +
        ` data-tip="${esc(f.path + (f.denied ? '\n' + t('ref.denied') : ''))}">` +
        `<span class="tg">${f.denied ? '🔒' : ''}</span>` +
        `<span class="tn">${esc(f.name)}</span></div>`);
    }
  };
  const i = treeRows.push({ kind: 'dir', path: root }) - 1;
  const open = treeOpen.has(root);
  rows.push(`<div class="trow" onclick="treeClick(${i})" data-tip="${esc(root)}">` +
    `<span class="tg">${open ? '▾' : '▸'}</span>` +
    `<span class="tn"><b>${esc(root.split('/').pop())}</b></span></div>`);
  if (open) emit(root, 1);
  box.innerHTML = rows.join('');
  syncTip();
}
async function openTreeFile(path) {
  const j = await J('GET', '/api/fs/file?path=' + encodeURIComponent(path));
  if (!j.ok) { alert(t('alert.loadFail', { error: j.error || '' })); return; }
  treeSel = path;
  renderTree();
  enterDoc(j);
}

// ---------- 管理セクション（右ペイン: chats モード時の既定表示） ----------
// ---- 表示タイムゾーン（設定ビューのシステムタブで選択・localStorage 永続化） ----
// dispTz='' はブラウザ既定（OS のゾーン）。保存値は IANA 名。サーバの ts は
// UTC ISO のまま保持し、表示時に Intl で変換する
const TZ_KEY = 'kasugai:tz';
let dispTz = localStorage.getItem(TZ_KEY) || '';
const tzAuto = () => Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
const tzName = () => dispTz || tzAuto();
const tzValid = (z) => {
  try { new Intl.DateTimeFormat('en', { timeZone: z }); return true; }
  catch { return false; }
};
// datalist に出す代表ゾーン（入力自体は任意の IANA 名を受理する）
const TZ_CHOICES = [
  'Asia/Tokyo', 'UTC',
  'Asia/Seoul', 'Asia/Shanghai', 'Asia/Taipei', 'Asia/Singapore',
  'Asia/Kolkata', 'Asia/Dubai', 'Australia/Sydney', 'Pacific/Auckland',
  'Europe/London', 'Europe/Paris', 'Europe/Berlin', 'Europe/Moscow',
  'America/Los_Angeles', 'America/Denver', 'America/Chicago',
  'America/New_York', 'America/Toronto', 'America/Sao_Paulo',
];
// sv-SE ロケール + h23 で 'YYYY-MM-DD HH:MM:SS' / 'HH:MM:SS' 形に揃える
let tzFmt = { key: '', d: null, t: null };
function tzFmts() {
  const key = tzName();
  if (tzFmt.key !== key) {
    const base = { timeZone: key, hourCycle: 'h23' };
    tzFmt = {
      key,
      d: new Intl.DateTimeFormat('sv-SE', { ...base, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      t: new Intl.DateTimeFormat('sv-SE', { ...base, hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    };
  }
  return tzFmt;
}
const tsDate = (ts) => { const d = new Date(ts); return isNaN(d) ? null : d; };
const fmtTs = (ts) => {
  const d = tsDate(ts);
  return d ? tzFmts().d.format(d) : (String(ts || '').replace('T', ' ').slice(0, 19) || '-');
};
const fmtTm = (ts) => {
  const d = tsDate(ts);
  return d ? tzFmts().t.format(d) : String(ts || '').slice(11, 19);
};
function saveTz() {
  const v = (document.getElementById('tz-input')?.value || '').trim();
  if (v && !tzValid(v)) { alert(t('tz.invalid', { tz: v })); return; }
  dispTz = v;
  localStorage.setItem(TZ_KEY, dispTz);
  renderSettings();
  loadMgmt();   // 右ペイン管理セクションの一覧時刻も即時反映
}
// 秒数 → 表示用の稼働時間（86400s=1d）
const fmtDur = (sec) => {
  const s = Math.floor(+sec || 0);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
  return Math.floor(s / 86400) + 'd ' + Math.floor(s % 86400 / 3600) + 'h';
};
let mgmtT = null;
const scheduleMgmt = () => {
  clearTimeout(mgmtT);
  mgmtT = setTimeout(loadMgmt, 400);
};
// 内部値（status/source/kind）の表示用変換: 辞書にキーがあれば訳文、
// 無ければ内部値をそのまま出す（未知の値の混入でも落ちない）
const tx = (key, raw) => { const v = t(key); return v === key ? String(raw ?? '') : v; };
// deferred 理由ピル（rate-limit / observing / cooldown / inhibited /
// silenced / storm）。inhibited は抑制元課題 key の末尾を併記する
const dfPill = (c) => {
  if (!c.deferred) return '';
  const tag = String(c.deferred).split(':')[0];
  const ref_ = tag === 'inhibited' ? c.inhibitedBy
    : tag === 'storm' ? c.stormKey : '';
  const by = ref_ ? ` ${esc(String(ref_).split(':').pop())}` : '';
  return `<span class="pill def">${esc(tx('cand.df.' + tag, tag))}${by}</span>`;
};
// data-tip 用に長文を丸める（ホバーポップアップが巨大化しないよう打切り）
const tipText = (s, n = 800) => { s = String(s || '').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };

// loop state の KPI 行（README §11）: 選択 repo スコープの課題から
// オープン件数・done 率・MTTR（detectedAt→done の平均）を集計する
function kpiRows(issues) {
  let open = 0, done = 0, failed = 0, mttr = 0, mttrN = 0;
  for (const i of issues) {
    if (i.status === 'done') {
      done++;
      const d0 = tsDate(i.detectedAt), d1 = tsDate(i.updatedAt);
      if (d0 && d1) { mttr += (d1 - d0) / 1000; mttrN++; }
    } else if (i.status === 'failed') {
      failed++;
    } else if (!['rejected', 'dropped'].includes(i.status)) {
      open++;
    }
  }
  const rate = done + failed ? Math.round(done / (done + failed) * 100) + '%' : '-';
  return `<div class="kv"><span>${esc(t('st.open'))}</span><b>${open}</b></div>` +
    `<div class="kv"><span>${esc(t('st.doneRate'))}</span><b>${rate}${done + failed ? ` (${done}/${done + failed})` : ''}</b></div>` +
    `<div class="kv"><span>MTTR</span><b>${mttrN ? fmtDur(mttr / mttrN) : '-'}</b></div>`;
}

async function loadMgmt() {
  const [st, sess, cand, iss, prop] = await Promise.all([
    J('GET', '/api/state'), J('GET', '/api/chat/sessions'),
    J('GET', '/api/candidates'), J('GET', '/api/issues'),
    J('GET', '/api/proposals')]);
  const sessions = (sess.sessions || []).filter((s) => matchRepo(s.repo));
  // candidates は人の判断待ちのみ表示（未起票・gated・queued・failed。
  // 起票は自動が既定で、実行中・終端の課題行は出さない。detect-pipeline.mmd）
  const candidates = (cand.candidates || []).filter((c) => matchRepo(c.repo) &&
    !['running', 'planning', 'plan_review', 'verifying', 'done', 'rejected', 'dropped'].includes(c.issueStatus || ''));
  candList = candidates;
  const stRank = { verifying: 0, running: 1, planning: 2, plan_review: 3,
                   retry: 4, queued: 5, gated: 6,
                   assessed: 7, failed: 8, done: 9, rejected: 10, dropped: 11 };
  const issues = (iss.issues || []).filter(matchIssue).sort((a, b) =>
    (stRank[a.status] ?? 10) - (stRank[b.status] ?? 10) ||
    (b.priority ?? 1) - (a.priority ?? 1) ||
    String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  issueList = issues;
  // dead man's switch heartbeat の状態行（/api/state.heartbeat。§11）
  const hb = st.heartbeat || {};
  const hbCell = hb.enabled
    ? `${esc(t('st.hbOn', { m: fmtDur((hb.minutes || 0) * 60) }))}` +
      (hb.lastPingOk === false ? ` <span class="pill unres">${esc(t('st.hbNg'))}</span>` : '')
    : esc(t('st.hbOff'));
  // detector 沈黙検知（/api/state.detectorHealth。detector-health.mmd・§11）
  const detCell = Object.entries((st.detectorHealth || {}).kinds || {})
    .map(([k, e]) => {
      const s = (e || {}).state || 'ok';
      return s === 'ok' ? esc(k)
        : `${esc(k)} <span class="pill unres">${esc(t(s === 'stopped' ? 'st.detStopped' : 'st.detSilent'))}</span>`;
    }).join(' ');
  document.getElementById('mstate').innerHTML =
    `<div class="kv"><span>${esc(t('st.version'))}</span><b>${esc(st.version || '-')}</b></div>` +
    `<div class="kv"><span>${esc(t('st.port'))}</span><b>${esc(st.port || '-')}</b></div>` +
    `<div class="kv"><span>${esc(t('st.repos'))}</span><b>${(st.repos || []).length}</b></div>` +
    `<div class="kv"><span>${esc(t('st.chats'))}</span><b>${sessions.length}</b></div>` +
    `<div class="kv"><span>${esc(t('st.candidates'))}</span><b>${candidates.length}</b></div>` +
    `<div class="kv"><span>${esc(t('st.heartbeat'))}</span><b>${hbCell}</b></div>` +
    `<div class="kv"><span>${esc(t('st.detectors'))}</span><b>${detCell || '-'}</b></div>` +
    kpiRows(issues);
  const issuePill = { gated: 'wait', queued: 'wait', retry: 'wait',
                      plan_review: 'wait',
                      running: 'run', planning: 'run', verifying: 'ver', done: 'live' };
  // candidate 行は起票済み課題の status を併記（起票は自動が既定。
  // detect-pipeline.mmd）。全行 対応/却下ボタンで人が一括判断する
  document.getElementById('mcands').innerHTML = candidates.length ? candidates.map((c) => {
    const st = c.issueStatus || '';
    // 対応 = 起票/承認/再実行を兼ねた即時 dispatch、却下 = rejected
    const btns = [];
    if (c.key && ['', 'gated', 'queued', 'failed'].includes(st)) {
      btns.push(`<button onclick="event.stopPropagation();candAct('${esc(c.key)}','dispatch')">${esc(t('iss.dispatch'))}</button>`);
      btns.push(`<button onclick="event.stopPropagation();candAct('${esc(c.key)}','reject')">${esc(t('iss.reject'))}</button>`);
    }
    return `<div class="item${c.key === curItemKey && centerMode === 'candidate' ? ' sel' : ''}"` +
      ` onclick="openCand('${esc(c.key)}')" data-tip="${esc(tipText((c.title ? c.title + '\n\n' : '') + (c.body ? c.body + '\n\n' : '') + t('prop.open.tip')))}">` +
      `<div>${st ? `<span class="pill ${issuePill[st] || ''}">${esc(tx('iss.st.' + st, st))}</span>` : `<span class="pill wait">${esc(t('cand.unfiled'))}</span>`}` +
      `${dfPill(c)}<b>${esc(c.title)}</b></div>` +
      `<div class="muted">${esc(tx('src.' + (c.source || 'manual'), c.source || 'manual'))} · ${esc(fmtTs(c.detectedAt))}</div>` +
      (btns.length ? `<div class="pbtns">${btns.join('')}</div>` : '') + `</div>`;
  }).join('') : `<div class="empty">${esc(t('cand.none'))}</div>`;
  document.getElementById('missues').innerHTML = issues.length ? issues.map((i) => {
    const st = i.status || '';
    const lvl = i.verifyLevel != null ? ` · L${i.verifyLevel}` : '';
    const btns = [];
    if (st === 'gated') {
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','approve')">${esc(t('iss.approve'))}</button>`);
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','reject')">${esc(t('iss.reject'))}</button>`);
    } else if (st === 'queued') {
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','dispatch')">${esc(t('iss.dispatch'))}</button>`);
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','reject')">${esc(t('iss.reject'))}</button>`);
    } else if (st === 'failed') {
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','requeue')">${esc(t('iss.requeue'))}</button>`);
    } else if (st === 'plan_review') {
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','plan-approve')">${esc(t('iss.planApprove'))}</button>`);
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','plan-reject')">${esc(t('iss.planReject'))}</button>`);
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','reject')">${esc(t('iss.reject'))}</button>`);
    } else if (st === 'verifying' && !i.pushApproved &&
               repoOfIssue(i)?.requirePushApproval) {
      btns.push(`<button onclick="event.stopPropagation();issueAct('${esc(i.key)}','push-approve')">${esc(t('iss.pushApprove'))}</button>`);
    }
    return `<div class="item${i.key === curItemKey && centerMode === 'issue' ? ' sel' : ''}"` +
      ` onclick="openIssue('${esc(i.key)}')" data-tip="${esc(tipText((i.title ? i.title + '\n\n' : '') + (i.body ? i.body + '\n\n' : '') + t('prop.open.tip')))}"><div>` +
      `<span class="pill ${issuePill[st] || ''}">${esc(tx('iss.st.' + st, st))}</span>` +
      `${i.retryAfter && new Date(i.retryAfter) > new Date() ? `<span class="pill def">${esc(t('iss.backoff'))}</span>` : ''}` +
      `${(i.priority ?? 1) >= 2 ? `<span class="pill prio">P${i.priority}</span>` : ''}<b>${esc(i.title)}</b></div>` +
      `<div class="muted">${esc(tx('src.' + (i.source || ''), i.source || ''))}${lvl} · ${esc(fmtTs(i.updatedAt))}</div>` +
      (btns.length ? `<div class="pbtns">${btns.join('')}</div>` : '') + `</div>`;
  }).join('') : `<div class="empty">${esc(t('iss.none'))}</div>`;
  propList = (prop.proposals || []).slice().reverse();
  document.getElementById('mprops').innerHTML = propList.length ? propList.map((pp) => {
    const fails = ((pp.vet && pp.vet.checks) || []).filter((x) => !x.ok).map((x) => x.name + ' ' + (x.path || ''));
    const badge = pp.status === 'pending'
      ? (pp.vet && pp.vet.ok ? '<span class="vetok">vet &#10003;</span>'
        : '<span class="vetng" data-tip="' + esc(fails.join(' / ')) + '">vet &#10007;</span>')
      : '<span class="vetst">' + esc(tx('prop.st.' + pp.status, pp.status)) + '</span>';
    const btns = pp.status === 'pending' ? '<div class="pbtns">' +
      '<button onclick="event.stopPropagation();propDecide(\'' + esc(pp.id) + '\',\'accept\')" ' + (pp.vet && pp.vet.ok ? '' : 'disabled') + '>' + esc(t('prop.accept')) + '</button>' +
      '<button onclick="event.stopPropagation();propDecide(\'' + esc(pp.id) + '\',\'decline\')">' + esc(t('prop.decline')) + '</button></div>' : '';
    const chs = pp.changes || [];
    const c0 = chs.length ? tipText(String(chs[0].content ?? ''), 600) : '';
    const tip = (pp.title ? pp.title + '\n\n' : '') +
      (pp.rationale ? pp.rationale + '\n\n' : '') +
      (chs.length ? t('prop.changes') + ':\n' +
        chs.map((c) => '- ' + String(c.path || '')).join('\n') +
        (c0 ? '\n\n' + c0 : '') + '\n\n' : '') +
      t('prop.open.tip');
    return '<div class="item' + (pp.id === curPropId && centerMode === 'proposal' ? ' sel' : '') + '"' +
      ' onclick="openProposal(\'' + esc(pp.id) + '\')"' +
      ' data-tip="' + esc(tipText(tip, 1600)) + '"><div><b>' + esc(pp.title) + '</b>' + badge + '</div>' +
      '<div class="muted">' + esc(tx('prop.kind.' + pp.kind, pp.kind || '')) + ' &middot; ' + esc(fmtTs(pp.createdAt)) + '</div>' + btns + '</div>';
  }).join('') : `<div class="empty">${esc(t('prop.none'))}</div>`;
  // 中央ペインに proposal 詳細を表示中なら最新の内容で描き直す
  // （採否・vet 更新の SSE push を即時反映）。消えた proposal は chat 表示へ戻す
  if (centerMode === 'proposal' && curPropId) {
    const p = propList.find((x) => x.id === curPropId);
    if (p) renderProposal(p);
    else { exitDoc(); if (sel == null) renderEmpty(); else loadChat(); }
  }
  // candidate/issue 詳細も同様に再描画（SSE push で状態が変わるため）。
  // カレント repo 絞込から外れた・消えた item は chat 表示へ戻す
  if (centerMode === 'candidate' && curItemKey) {
    const c = candList.find((x) => x.key === curItemKey);
    if (c) renderCand(c);
    else { exitDoc(); if (sel == null) renderEmpty(); else loadChat(); }
  }
  if (centerMode === 'issue' && curItemKey) {
    const i = issueList.find((x) => x.key === curItemKey);
    if (i) renderIssue(i);
    else { exitDoc(); if (sel == null) renderEmpty(); else loadChat(); }
  }
  syncTip();              // 描画し直した行に残ったポップアップを閉じる（同一内容は維持）
}

// ---------- issues（課題の人ゲート操作。状態遷移は server の pipeline のみ） ----------
// key は ':'/'/' を含むため URI エンコードして {key} セグメントに載せる
async function issueAct(key, action) {
  const r = await J('POST', `/api/issues/${encodeURIComponent(key)}/${action}`);
  if (!r.ok) alert(r.error || 'error');
  loadMgmt();
}
// follow-up 追記: 起票時 freeze の課題本文（intakeSnapshot）には混入せず
// followUps へ記録し、次回 run の prompt で「フォローアップ入力」として渡す
async function issueFollowup(key) {
  const el = document.getElementById('fu-text');
  const text = (el?.value || '').trim();
  if (!text) return;
  const r = await J('POST', `/api/issues/${encodeURIComponent(key)}/followup`, { text });
  if (!r.ok) alert(r.error || 'error');
  loadMgmt();
}
// 分割起票（manual-0577d650）: splitProposal.items を初期値に、人が
// | 区切りで子課題タイトル群を編集して分割する。提案 items に一致する
// タイトルは提案の body を引き継ぐ
async function issueSplit(key) {
  const i = issueList.find((x) => x.key === key);
  const sug = (((i || {}).splitProposal || {}).items) || [];
  const text = prompt(t('iss.splitPrompt'), sug.map((x) => x.title).join(' | '));
  if (text == null) return;
  const items = text.split('|').map((s) => s.trim()).filter(Boolean)
    .map((title) => {
      const m = sug.find((x) => x.title === title);
      return { title, body: m ? m.body : title };
    });
  if (items.length < 2) { alert(t('iss.splitNeed2')); return; }
  if (!confirm(t('iss.splitConfirm', { count: items.length }))) return;
  const r = await J('POST', `/api/issues/${encodeURIComponent(key)}/split`, { items });
  if (!r.ok) alert(r.error || 'error');
  loadMgmt();
}

// ---------- candidates（判断待ち inbox の人ゲート操作。未起票は即時起票して判断） ----------
async function candAct(key, action) {
  const r = await J('POST', `/api/candidates/${encodeURIComponent(key)}/${action}`);
  if (!r.ok) alert(r.error || 'error');
  loadMgmt();
}

// ---------- proposals（vet は採否の前提検査） ----------
let propList = [];      // loadMgmt が保持する proposals 一覧（新しい順）
let curPropId = null;   // 中央ペインに詳細表示中の proposal id
async function propDecide(id, decision) {
  const r = await J('POST', `/api/proposals/${id}/${decision}`);
  if (!r.ok) alert(r.error === 'vet failed' ? t('prop.vetFail') : (r.error || 'error'));
  loadMgmt();           // 中央ペイン表示中なら loadMgmt が詳細も再描画する
}
// proposals カードクリック → 中央ペインに詳細表示。
// 採否ボタンは一覧と同じくここからも操作できる（vet 不合格は accept 不可）
function openProposal(id) {
  const p = propList.find((x) => x.id === id);
  if (!p) return;
  curPropId = id;
  centerMode = 'proposal';
  curDoc = null;
  document.getElementById('main').classList.add('doc');
  document.getElementById('box').classList.remove('htmlview');
  document.getElementById('viewsw').style.display = 'none';
  renderSide();
  document.getElementById('ctitle').textContent = p.title || t('mgmt.proposals');
  document.getElementById('status').textContent = p.id;
  renderProposal(p);
  loadMgmt();           // 一覧の選択ハイライトを即時反映
}
// proposal 1件の詳細描画: 概要カード（採否ボタン）+ vet 検査カード +
// changes カード（.mmd=mermaid図 / .md=Markdown / その他=原文）
function renderProposal(p) {
  const checks = (p.vet && p.vet.checks) || [];
  const adv = (p.vet && p.vet.advisories) || [];
  const pillCls = p.status === 'pending' ? 'wait'
    : p.status === 'accepted' ? 'live' : 'unres';
  const btns = p.status === 'pending' ? '<div class="pbtns">' +
    '<button class="primary" onclick="propDecide(\'' + esc(p.id) + '\',\'accept\')" ' +
    (p.vet && p.vet.ok ? '' : 'disabled') + '>' + esc(t('prop.accept')) + '</button>' +
    '<button onclick="propDecide(\'' + esc(p.id) + '\',\'decline\')">' + esc(t('prop.decline')) + '</button></div>' : '';
  const head = '<div class="rcard" style="max-width:none"><div><b>' + esc(p.title) + '</b> ' +
    '<span class="pill ' + pillCls + '">' + esc(tx('prop.st.' + p.status, p.status || '-')) + '</span>' +
    '<span class="pill">' + esc(tx('prop.kind.' + p.kind, p.kind || '')) + '</span>' +
    (p.vet ? (p.vet.ok ? '<span class="vetok">vet &#10003;</span>'
      : '<span class="vetng">vet &#10007;</span>') : '') + '</div>' +
    '<div class="muted">' + esc(p.id) +
    (p.issueKey ? ' &middot; ' + esc(t('prop.issue', { key: p.issueKey })) : '') + '</div>' +
    '<div class="muted">' + esc(t('prop.created')) + ': ' + esc(fmtTs(p.createdAt)) +
    (p.decidedAt ? ' &middot; ' + esc(t('prop.decided')) + ': ' + esc(fmtTs(p.decidedAt)) : '') + '</div>' +
    (p.rationale ? '<div class="muted">' + esc(t('prop.rationale')) + ': ' + esc(p.rationale) + '</div>' : '') +
    btns + '</div>';
  const vetCard = checks.length || adv.length
    ? '<div class="rcard" style="max-width:none"><b>' + esc(t('prop.vet')) + '</b>' +
      checks.map((c) => '<div class="muted"><span class="' + (c.ok ? 'vetok' : 'vetng') +
        '" style="margin-left:0">' + (c.ok ? '&#10003;' : '&#10007;') + '</span> ' +
        esc(c.name) + ' <b>' + esc(c.path) + '</b> ' + esc(c.detail) + '</div>').join('') +
      (adv.length ? '<div class="muted">' + esc(t('prop.advisories')) + ': ' +
        adv.map(esc).join(' / ') + '</div>' : '') + '</div>'
    : '';
  const chs = (p.changes || []).map((c) => {
    const path = String(c.path || '');
    const text = String(c.content ?? '');
    const body = /\.mmd$/i.test(path)
      ? '<pre class="mermaid">' + esc(Viewer._mmdBody(text)) + '</pre>'
      : /\.(md|markdown)$/i.test(path)
        ? '<div class="msg md" style="max-width:none">' + Viewer.md(text) + '</div>'
        : '<pre class="rawfile">' + esc(text) + '</pre>';
    return '<div class="rcard" style="max-width:none"><div class="muted"><b>' +
      esc(path) + '</b></div>' + body + '</div>';
  }).join('');
  const box = document.getElementById('box');
  box.innerHTML = head + vetCard +
    '<div class="muted" style="margin:4px 0">' + esc(t('prop.changes')) + '</div>' + chs;
  Viewer.drawMermaid(box);
  box.scrollTop = 0;
}

// ---------- candidates / issues の詳細（中央ペイン表示） ----------
let candList = [];      // loadMgmt が保持する candidates 一覧（カレント repo 絞込済み）
let issueList = [];     // 同 issues 一覧
let curItemKey = null;  // 中央ペインに詳細表示中の candidate/issue key
// 管理セクションの行クリック → 中央ペインに詳細表示。
// 行内の操作ボタンは一覧と同じくここからも操作できる
function openItem(mode, key) {
  const it = (mode === 'candidate' ? candList : issueList)
    .find((x) => x.key === key);
  if (!it) return;
  curItemKey = key;
  curPropId = null;
  centerMode = mode;
  curDoc = null;
  document.getElementById('main').classList.add('doc');
  document.getElementById('box').classList.remove('htmlview');
  document.getElementById('viewsw').style.display = 'none';
  renderSide();
  document.getElementById('ctitle').textContent =
    it.title || t(mode === 'candidate' ? 'mgmt.candidates' : 'mgmt.issues');
  document.getElementById('status').textContent = key;
  (mode === 'candidate' ? renderCand : renderIssue)(it);
  loadMgmt();           // 一覧の選択ハイライトを即時反映
}
const openCand = (key) => openItem('candidate', key);
const openIssue = (key) => openItem('issue', key);
// candidate/issue 共通のヘッダカード: タイトル・状態ピル・source・時刻・
// URL・ラベル・人ゲート操作ボタン（issue は verifyLevel と push 承認も）
function renderItemHead(it, isIssue) {
  const st = isIssue ? (it.status || '') : (it.issueStatus || '');
  const pillCls = { gated: 'wait', queued: 'wait', retry: 'wait', plan_review: 'wait',
                    running: 'run', planning: 'run', verifying: 'ver', done: 'live' }[st] || '';
  const btns = [];
  if (!isIssue) {
    // candidate: 判断待ち（未起票・gated・queued・failed）は 対応/却下
    // （対応 = 起票/承認/再実行を兼ねた即時 dispatch、却下 = rejected）
    if (it.key && ['', 'gated', 'queued', 'failed'].includes(st)) {
      btns.push(`<button onclick="candAct('${esc(it.key)}','dispatch')">${esc(t('iss.dispatch'))}</button>`);
      btns.push(`<button onclick="candAct('${esc(it.key)}','reject')">${esc(t('iss.reject'))}</button>`);
    }
  } else if (st === 'gated') {
    btns.push(`<button onclick="issueAct('${esc(it.key)}','approve')">${esc(t('iss.approve'))}</button>`);
    btns.push(`<button onclick="issueAct('${esc(it.key)}','reject')">${esc(t('iss.reject'))}</button>`);
  } else if (st === 'queued') {
    btns.push(`<button onclick="issueAct('${esc(it.key)}','dispatch')">${esc(t('iss.dispatch'))}</button>`);
    btns.push(`<button onclick="issueAct('${esc(it.key)}','reject')">${esc(t('iss.reject'))}</button>`);
  } else if (st === 'failed') {
    btns.push(`<button onclick="issueAct('${esc(it.key)}','requeue')">${esc(t('iss.requeue'))}</button>`);
  } else if (st === 'plan_review') {
    btns.push(`<button onclick="issueAct('${esc(it.key)}','plan-approve')">${esc(t('iss.planApprove'))}</button>`);
    btns.push(`<button onclick="issueAct('${esc(it.key)}','plan-reject')">${esc(t('iss.planReject'))}</button>`);
    btns.push(`<button onclick="issueAct('${esc(it.key)}','reject')">${esc(t('iss.reject'))}</button>`);
  }
  if (isIssue && st === 'verifying' && !it.pushApproved &&
      repoOfIssue(it)?.requirePushApproval) {
    btns.push(`<button onclick="issueAct('${esc(it.key)}','push-approve')">${esc(t('iss.pushApprove'))}</button>`);
  }
  // 分割提案（manual-0577d650）: 大規模課題は gated で splitProposal を持ち、
  // 人が「分割起票」で子課題群へ分ける（queued でも起票前なら可）
  if (isIssue && it.splitProposal && (st === 'gated' || st === 'queued')) {
    btns.push(`<button onclick="issueSplit('${esc(it.key)}')">${esc(t('iss.split'))}</button>`);
  }
  const labels = (it.labels || [])
    .map((l) => `<span class="pill">${esc(l)}</span>`).join('');
  return '<div class="rcard" style="max-width:none"><div><b>' + esc(it.title) + '</b> ' +
    (st ? `<span class="pill ${pillCls}">${esc(tx('iss.st.' + st, st))}</span>` : '') +
    (!isIssue && !st ? `<span class="pill wait">${esc(t('cand.unfiled'))}</span>` : '') +
    (!isIssue ? dfPill(it) : '') +
    (isIssue && it.retryAfter && new Date(it.retryAfter) > new Date()
      ? `<span class="pill def">${esc(t('iss.backoff'))}: ${esc(fmtTs(it.retryAfter))}</span>` : '') +
    `<span class="pill">${esc(tx('src.' + (it.source || ''), it.source || ''))}</span>` +
    (isIssue && it.verifyLevel != null ? `<span class="pill">L${it.verifyLevel}</span>` : '') +
    (isIssue && it.priority != null ? `<span class="pill">P${it.priority}</span>` : '') +
    (isIssue && it.splitProposal
      ? `<span class="pill def">${esc(t('iss.splitProp'))}${it.splitProposal.reason ? ': ' + esc(it.splitProposal.reason) : ''}</span>` : '') +
    (isIssue && it.splitFrom ? `<span class="pill">${esc(t('iss.splitFrom'))}</span>` : '') +
    (isIssue && it.splitInto ? `<span class="pill">${esc(t('iss.splitInto', { count: it.splitInto.length }))}</span>` : '') +
    labels + '</div>' +
    `<div class="muted">${esc(it.key || '')}</div>` +
    `<div class="muted">${esc(t('det.detected'))}: ${esc(fmtTs(it.detectedAt))}` +
    (it.updatedAt ? ` &middot; ${esc(t('det.updated'))}: ${esc(fmtTs(it.updatedAt))}` : '') +
    (it.lastSeen ? ` &middot; ${esc(t('det.lastSeen'))}: ${esc(fmtTs(it.lastSeen))}` : '') + '</div>' +
    (it.url ? `<div class="muted"><a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.url)}</a></div>` : '') +
    (btns.length ? `<div class="pbtns">${btns.join('')}</div>` : '') + '</div>';
}
// 本文カード（body は Markdown として描画。mermaid ブロックも図になる）
const renderItemBody = (body) => body
  ? '<div class="rcard" style="max-width:none"><div class="msg md" style="max-width:none">' +
    Viewer.md(body) + '</div></div>'
  : '';
function renderCand(c) {
  const box = document.getElementById('box');
  box.innerHTML = renderItemHead(c, false) + renderItemBody(c.body);
  Viewer.drawMermaid(box);
  box.scrollTop = 0;
}
// issue は検証情報（合格条件・検証メモ・retry 回数）と実行履歴を追加表示
function renderIssue(i) {
  const info = (i.acceptance || i.verifyNote || i.retries || i.verifyBacks)
    ? '<div class="rcard" style="max-width:none">' +
      (i.acceptance ? `<div class="muted">${esc(t('iss.acceptance'))}: ${esc(i.acceptance)}</div>` : '') +
      (i.verifyNote ? `<div class="muted">${esc(t('iss.verifyNote'))}: ${esc(i.verifyNote)}</div>` : '') +
      (i.planNote ? `<div class="muted">${esc(t('iss.planNote'))}: ${esc(i.planNote)}</div>` : '') +
      `<div class="muted">retries: ${i.retries ?? 0} &middot; verifyBacks: ${i.verifyBacks ?? 0}</div>` +
      '</div>' : '';
  // 計画承認ゲート（manual-883d17ee）: 生成済み計画と critic 結果を表示
  const criticFindings = ((i.planCritic || {}).findings) || [];
  const plan = (i.plan || i.planNote || criticFindings.length)
    ? '<div class="rcard" style="max-width:none"><b>' + esc(t('iss.plan')) + '</b>' +
      (i.planAt ? `<div class="muted">${esc(fmtTs(i.planAt))}` +
        (i.planApproved ? ` &middot; ${esc(t('iss.planApproved'))}` : '') + '</div>' : '') +
      (i.plan ? `<div class="msg md" style="max-width:none">${Viewer.md(String(i.plan))}</div>` : '') +
      (criticFindings.length
        ? '<div class="muted">' + esc(t('iss.planCritic')) + ':</div>' +
          criticFindings.map((f) =>
            `<div class="muted">[${esc(f.severity || '')} ${Math.round((f.confidence ?? 0) * 100)}%] ${esc(f.note || '')}</div>`).join('')
        : '') +
      '</div>' : '';
  // 独立 diff レビュー（manual-475831d2）: push 前批評の findings を表示
  const drev = i.diffReview || {};
  const drevFindings = drev.findings || [];
  const drevCard = (drev.at || drevFindings.length)
    ? '<div class="rcard" style="max-width:none"><b>' + esc(t('iss.diffReview')) + '</b>' +
      (i.diffReviewOk ? ` <span class="pill run">${esc(t('iss.diffReviewOk'))}</span>` : '') +
      (drev.at ? `<div class="muted">${esc(fmtTs(drev.at))}</div>` : '') +
      (drev.error ? `<div class="muted">${esc(drev.error)}</div>` : '') +
      drevFindings.map((f) =>
        `<div class="muted">[${esc(f.severity || '')} ${Math.round((f.confidence ?? 0) * 100)}%] ${esc(f.note || '')}</div>`).join('') +
      '</div>' : '';
  const members = (i.stormMembers || []).length
    ? '<div class="rcard" style="max-width:none"><b>' +
      esc(t('iss.stormMembers', { count: i.stormMembers.length })) + '</b>' +
      i.stormMembers.map((m) =>
        `<div class="muted">${esc(m.title)} <span class="muted">${esc(m.key)}</span></div>`)
        .join('') + '</div>' : '';
  const runs = (i.runs || []).length
    ? '<div class="rcard" style="max-width:none"><b>' + esc(t('iss.runs')) + '</b>' +
      (i.runs || []).map((r) =>
        `<div class="muted">${esc(fmtTs(r.startedAt))}` +
        (r.sessionLog ? ` &middot; ${esc(r.sessionLog)}` : '') + '</div>').join('') +
      '</div>' : '';
  // intake スナップショット + followUps（起票後の追記は本文に混入せず
  // 次回 run のフォローアップ入力として渡す。intake-snapshot.mmd）
  const fus = (i.followUps || []);
  const fuCard = '<div class="rcard" style="max-width:none"><b>' + esc(t('iss.followups')) + '</b>' +
    (i.intakeSnapshot && i.intakeSnapshot.at
      ? `<div class="muted">${esc(t('iss.snapshot'))}: ${esc(fmtTs(i.intakeSnapshot.at))}</div>` : '') +
    (fus.length
      ? fus.map((f) =>
          `<div class="muted">[${esc(f.kind || 'note')}] ${esc(f.text)} ` +
          `<span class="muted">${esc(fmtTs(f.at))}` +
          (f.consumedAt ? ` &middot; ${esc(t('iss.fuConsumed'))}` : '') + '</span></div>').join('')
      : `<div class="muted">${esc(t('iss.fuNone'))}</div>`) +
    `<div class="pbtns"><input id="fu-text" placeholder="${esc(t('iss.fuPh'))}" style="flex:1">` +
    `<button onclick="issueFollowup('${esc(i.key)}')">${esc(t('iss.fuAdd'))}</button></div></div>`;
  const box = document.getElementById('box');
  box.innerHTML = renderItemHead(i, true) + info + plan + members + runs + fuCard + renderItemBody(i.body);
  Viewer.drawMermaid(box);
  box.scrollTop = 0;
}

// ---------- 省略ラベルの全文ポップアップ ----------
// [data-tip] へホバーで即時表示（ネイティブ title より速く改行も出せる）。
// 行の直下に出し、下端がはみ出す時は行の上側へ。innerHTML 描き直しや
// スクロールで行が動いた時は閉じずにカーソル位置の要素へ張り直す（evalTip）
// — busy 中の SSE 再描画で閲覧中のポップアップが即消えしないようにする
let tipFor = null;        // 表示中のポップアップの元要素
const tipPos = { x: 0, y: 0 };  // 直近のカーソル位置（張り直しの判定に使う）
const hideTip = () => { tipFor = null; document.getElementById('tip').style.display = 'none'; };
function showTip(t) {
  const tip = document.getElementById('tip');
  tipFor = t;
  tip.textContent = t.dataset.tip;
  tip.style.display = 'block';
  const r = t.getBoundingClientRect();
  tip.style.left = Math.max(4, Math.min(r.left, innerWidth - tip.offsetWidth - 8)) + 'px';
  let y = r.bottom + 4;
  if (y + tip.offsetHeight > innerHeight - 8)
    y = Math.max(4, r.top - tip.offsetHeight - 4);
  tip.style.top = y + 'px';
}
// カーソル位置の [data-tip] を見て表示を張り直し/閉じる
const evalTip = () => {
  const t = document.elementFromPoint(tipPos.x, tipPos.y)?.closest?.('[data-tip]');
  if (t) showTip(t); else hideTip();
};
// 再描画やスクロールの隙間にカーソル下の要素が一瞬 [data-tip] 無しになる
// だけのケースを吸収するため、閉じる判定は少し遅らせて再評価する
let tipEvalT = null;
const scheduleEvalTip = () => {
  clearTimeout(tipEvalT);
  tipEvalT = setTimeout(evalTip, 60);
};
// 一覧の innerHTML 再描画後に呼ぶ（元要素が消えていたらカーソル下へ張り直す）
const syncTip = () => { if (tipFor && !tipFor.isConnected) evalTip(); };
function initTip() {
  document.addEventListener('mousemove', (e) => { tipPos.x = e.clientX; tipPos.y = e.clientY; },
    { passive: true });
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest?.('[data-tip]');
    if (t) { clearTimeout(tipEvalT); showTip(t); } else scheduleEvalTip();
  });
  document.addEventListener('mouseout', (e) => {
    const t = e.target.closest?.('[data-tip]');
    if (t && !t.contains(e.relatedTarget)) scheduleEvalTip();
  });
  document.addEventListener('scroll', scheduleEvalTip, true);   // 行がずれたらカーソル下へ張り直す
  document.addEventListener('mousedown', hideTip);
}

// ---------- ペイン幅（境界ドラッグで可変・localStorage 永続化） ----------
function initGrips() {
  const saved = (id, d) => {
    const v = parseInt(localStorage.getItem('pane:' + id), 10);
    return Number.isFinite(v) ? v : d;
  };
  const mgmt = document.getElementById('mgmt');
  const side = document.getElementById('side');
  mgmt.style.width = saved('mgmt', 240) + 'px';
  side.style.width = saved('side', 320) + 'px';
  const drag = (grip, pane, min, max, widthAt) => {
    grip.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const off = widthAt(e.clientX) - pane.getBoundingClientRect().width;
      grip.classList.add('on');
      document.body.classList.add('dragging');
      const move = (ev) => {
        const w = Math.min(max, Math.max(min, widthAt(ev.clientX) - off));
        pane.style.width = w + 'px';
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        grip.classList.remove('on');
        document.body.classList.remove('dragging');
        localStorage.setItem('pane:' + pane.id, String(pane.getBoundingClientRect().width));
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  };
  drag(document.getElementById('grip-l'), mgmt, 200, 640, (x) => x);
  drag(document.getElementById('grip-r'), side, 160, 560, (x) => innerWidth - x);
}

// ---------- 起動 ----------
// 言語は initI18n で復元（localStorage → ブラウザ言語 → en の順）。
// langsel の選択肢を SUPPORTED_LANGUAGES から構築し、静的DOMへ辞書を
// 適用してから各ペインを描く
let booted = false;        // 初回 boot 済みか（再起動後の再 boot で初期表示へ戻さない）
async function boot() {
  await initI18n();
  const langsel = document.getElementById('langsel');
  langsel.innerHTML = SUPPORTED_LANGUAGES.map((l) =>
    `<option value="${l}">${LANGUAGE_NAMES[l]}</option>`).join('');
  langsel.value = getLanguage();
  applyI18n();
  document.title = (isDev ? '[DEV] ' : '') + t('app.title');
  await refreshRepos();
  await refreshAgents();             // active 接続AI（新規chatの実行体表示用）
  // セッション未開始でもモデル/モード選択肢を出す
  const oc = await J('GET', '/api/chat/options');
  renderOpts(oc);
  await loadSessions();
  if (!booted) { booted = true; showStatus(); }   // 初期表示は処理状況
  else renderEmpty();
  renderSide();
  loadMgmt();
  applyChatTab();          // チャット/コンソールタブの復元
}
// 言語切替: setLanguage が静的DOM(data-i18n)を適用するので、
// JS 生成文字列を含むビュー（一覧・ボード・設定・doc 本文）はここで再描画する
async function changeLang(v) {
  await setLanguage(v);
  document.title = (isDev ? '[DEV] ' : '') + t('app.title');
  document.getElementById('langsel').value = getLanguage();
  document.getElementById('hint').textContent = hintText();
  if (busySince) setSendBusy(true);
  if (restartShown) showRestarting(restartState.pending, restartState.forced);
  loadSessions(); loadMgmt(); renderSide();
  if (centerMode === 'status') showStatus();
  else if (centerMode === 'settings') showSettings();
  else if (centerMode === 'manual') showManual();
  else if (centerMode === 'proposal' && curPropId) openProposal(curPropId);
  else if (centerMode === 'candidate' && curItemKey) openCand(curItemKey);
  else if (centerMode === 'issue' && curItemKey) openIssue(curItemKey);
  else if (centerMode === 'doc') enterDoc(curDoc);
  else if (sel == null) renderEmpty(); else loadChat();
}
// SSE push: 状態変化の即時反映（ポーリングはしない）
const es = new EventSource('/api/events');
es.addEventListener('chat', (e) => {
  const { id } = JSON.parse(e.data);
  loadSessions();
  scheduleMgmt();
  scheduleStatus();
  if (id === sel) loadChat();
});
es.addEventListener('chats', () => { loadSessions(); scheduleMgmt(); scheduleStatus(); });
es.addEventListener('candidates', scheduleMgmt);
es.addEventListener('issues', scheduleMgmt);
es.addEventListener('heartbeat', scheduleMgmt);
es.addEventListener('detector-health', scheduleMgmt);
es.addEventListener('proposals', scheduleMgmt);
es.addEventListener('silences', () => { silRefresh(); scheduleMgmt(); });
es.addEventListener('console', (e) => appendConLines(JSON.parse(e.data).lines));
es.addEventListener('repos', async () => {
  const prev = repoScope;
  await refreshRepos();          // 登録解除等で選択 repo が無効になるとフォールバック
  if (repoScope !== prev) { applyRepoScope(); return; }   // 選択が変わった → 全ペイン反映
  loadMgmt();
  if (centerMode === 'settings') showSettings();
});
es.addEventListener('chatAgents', async () => { await refreshAgents();
  loadSessions();
  if (centerMode === 'settings') showSettings(); });
es.addEventListener('assets', (e) => {   // CDN アセット更新の状態変化
  sysState.assets = JSON.parse(e.data);
  if (centerMode === 'settings' && setTab === 'system') renderSettings();
});
es.addEventListener('autostart', (e) => {  // 自動起動（タスク登録）の状態変化
  sysState.autostart = JSON.parse(e.data);
  if (centerMode === 'settings' && setTab === 'system') renderSettings();
});
es.addEventListener('restart', (e) => {  // control 再起動の pending/restarting 表示
  const d = JSON.parse(e.data);
  // respawner 起動失敗などで再起動が中止された場合（server は exit せず継続）
  if (d.failed) {
    clearRestarting();
    alert(t('alert.restartFail', { error: d.error || '' }));
    return;
  }
  showRestarting(!!d.pending, !!d.forced);
});
es.onopen = () => {            // 再起動後の自動再接続 → 全表示を再取得
  if (!restartShown) return;
  clearRestarting();
  boot();
  if (centerMode === 'settings') showSettings();
  else if (centerMode === 'status') showStatus();
};
setInterval(() => { // busy 表示の経過切替のみ時計で更新
  if (busySince) setSendBusy(true);
}, 5000);
initGrips();
initMmdZoom();
initTip();
boot();
</script>
